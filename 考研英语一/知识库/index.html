<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --ink:#1f2430; --sub:#7a8194;
    --brand:#4f6ef7; --line:#e8eaf0; --user:#eef1fb; --ai:#f7f8fd;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  header{
    background:linear-gradient(135deg,#2b3150,#1f2430);
    color:#fff; padding:20px 16px 16px;
  }
  header h1{margin:0; font-size:20px; font-weight:800}
  header p{margin:6px 0 0; font-size:13px; opacity:.75}
  header input{
    margin-top:12px; width:100%; border:none; border-radius:12px;
    padding:12px 14px; font-size:15px; background:rgba(255,255,255,.14); color:#fff;
    outline:none;
  }
  header input::placeholder{color:rgba(255,255,255,.55)}
  main{padding:16px; max-width:860px; margin:0 auto}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 16px}
  .chip{
    border:none; background:var(--card); border:1px solid var(--line); color:var(--sub);
    padding:7px 14px; border-radius:999px; font-size:13px; cursor:pointer;
  }
  .chip.on{background:var(--brand); color:#fff; border-color:var(--brand)}
  .subject{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(20,24,40,.04);
  }
  .subject h2{margin:0 0 4px; font-size:17px}
  .subject .meta{color:var(--sub); font-size:13px; margin-bottom:6px}
  .entry{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line)}
  .entry:first-of-type{border-top:none; margin-top:0; padding-top:0}
  .entry .word{font-size:20px; font-weight:800; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .entry .word .cnt{font-size:12px; color:var(--sub); font-weight:400}
  details{
    border:1px solid var(--line); border-radius:14px; margin-top:10px;
    background:#fff; overflow:hidden;
  }
  details summary{
    cursor:pointer; padding:12px 14px; list-style:none; font-size:14.5px; font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  details summary::-webkit-details-marker{display:none}
  details summary .q{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  details summary .arrow{color:var(--sub); transition:transform .2s}
  details[open] summary .arrow{transform:rotate(90deg)}
  details .body{padding:0 14px 14px}
  .msg{display:flex; gap:10px; margin-top:12px}
  .msg .avatar{
    width:28px; height:28px; border-radius:9px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;
  }
  .msg.user .avatar{background:var(--brand)}
  .msg.ai .avatar{background:#5a647e}
  .msg .bubble{
    flex:1; border-radius:12px; padding:10px 13px; font-size:14.5px; min-width:0;
    overflow-wrap:break-word; word-break:break-word;
  }
  .msg.user .bubble{background:var(--user)}
  .msg.ai .bubble{background:var(--ai)}
  .msg .bubble p{margin:0 0 8px}
  .msg .bubble p:last-child{margin-bottom:0}
  .msg .bubble hr{border:none; border-top:1px dashed var(--line); margin:10px 0}
  .msg .bubble strong{color:#2b3150}
  .msg .bubble code{
    background:#e8ebf5; border-radius:5px; padding:1px 5px; font-size:13px;
    font-family:Consolas,Menlo,monospace;
  }
  .msg .bubble table{border-collapse:collapse; width:100%; margin:8px 0; font-size:13px}
  .msg .bubble th,.msg .bubble td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
  .msg .bubble th{background:#eef1fb}
  .msg .bubble ul,.msg .bubble ol{margin:6px 0; padding-left:22px}
  .msg .bubble blockquote{
    margin:8px 0; padding:6px 12px; border-left:3px solid var(--brand);
    background:#f0f3fd; border-radius:6px; color:#3a4160;
  }
  .empty{color:var(--sub); text-align:center; padding:40px 0}
  footer{
    text-align:center; color:var(--sub); font-size:12px; padding:20px 12px 40px;
  }
</style>

<script>
const DATA = {"subjects": [{"name": "英语", "entries": [{"key": "导学", "label": "开篇 · 词根词缀怎么学", "kind": "guide", "cards": [{"q": "假设你是一个资深的考研教师，英语一的。我记忆单词的过程中，有一些词根词缀的问题想请教一下你，希望你可以把我当作小白一样幽默形象的解释解释", "a": ["哈喽小白同学！来，先放下单词书，喝口水。我是你的“考研英语相声专场”主讲人，今天咱就专治各种词根词缀“脸盲症”。保证不用术语砸你，全用“人话”和“段子”给你整明白。\n\n---\n\n**第一个灵魂拷问：词根词缀到底是个啥？**\n\n你就想象**单词是火锅**：\n- **词根** = **锅底**（麻辣/番茄/菌汤）。这是灵魂，决定了单词的“基本味儿”。比如 `spect` 就是“看”的锅底。\n- **前缀** = **蘸料**（麻酱/油碟）。它不改锅底味儿，但给味道**加方向**。比如 `re-`（往回/再），`ex-`（向外）。\n- **后缀** = **配菜**（毛肚/土豆）。它不改变“吃”这个动作，但决定了**这口吃到嘴里是啥口感**（词性）。比如 `-tion` 是名词口感，`-ous` 是形容词口感。\n\n**结论：** 别死背整根火腿肠（完整单词），要学会**尝出锅底+蘸料+配菜**。\n\n---\n\n**第二个常见病：为啥同一个词根，长得不一样？**\n\n这叫“词根变形记”，比渣男换脸还快，但核心不变。\n比如 **`fac`/`fic`/`fect`** 都等于“做” (do)。\n- `factory`（工厂）= 做事儿的地方。\n- `efficient`（高效的）= 往外（ef-）做出（fic）东西 → 能出活儿 → 高效。\n- `infect`（感染）= 往里（in-）做（fect）进去 → 把病毒“做”你身体里了。\n\n**记住：** 元音（a/e/i/o/u）是词根的“衣服”，辅音（f/c/t）是“骨架”。衣服随便换，骨架不变。你只要抓住“f-c-t”像“做”，管它中间是a还是e，都是它！\n\n---\n\n**第三个要命点：前缀有“多重人格”怎么办？**\n\n这是考研英语最爱挖的坑。比如 **`con-`**：\n- 别只背“共同”，它更常表 **“一起/加强”**。\n- `connect`（连接）= 大家一起“扭”（nect）在一起。\n- `concentrate`（集中）= 一起往一个中心（centr）走 → 集中注意力。\n\n再比如 **`de-`**：\n- 别只记“向下”，考研最爱考 **“否定/去除”**。\n- `decrease`（减少）= 向下长。\n- `deceive`（欺骗）= 把你“拿走”（ceive=拿），让你啥也拿不到 → 欺骗！ \n（你看，这么记是不是瞬间想捶那个骗子？）\n\n---\n\n**第四个救命绝招：猜词大法——看“脸色”**\n\n考场上遇到生词，别慌！**看前后缀的脸色**：\n- 前缀决定**态度**：是`pro-`（向前/赞成）还是`anti-`（反对）？是`bene-`（好）还是`mal-`（坏）？\n- 后缀决定**词性**：`-ive`一般是形容词（…的），`-ity`一般是名词（…性）。\n- 中间词根猜个大概。\n\n**实战演个戏：** 遇到 `malodorous`。\n- `mal-` = 坏；`odor` = 气味；`-ous` = …的。\n- 合起来：**“坏气味儿的”** → 臭烘烘的！你看，不用查字典，你都能骂它“臭的”。\n\n---\n\n**最后送你三个“保命”口诀（考研英语一专用）：**\n\n1. **“别贪多”**：每天只啃 **1个前缀 + 1个后缀 + 3个核心词根**，但要把它们当连续剧串起来编故事。\n2. **“别硬套”**：20%的单词有历史演化，套不上就把它当“特例情人”，单独宠幸（硬记）。\n3. **“别忘复习”**：词根词缀是**鱼竿**，不是**鱼**。你今天学的是“钓鱼方法”，但明天不练，鱼竿会生锈！\n\n现在，带着“吃火锅”的心态，去拆解你明天背的第一个单词吧！有问题随时来“砸场子”，我在这儿等你。加油，准研究生！🎓（记得，词根词缀是帮你省力的，不是让你多背一套“摩斯密码”的！）"]}]}, {"key": "addict", "label": "addict", "kind": "word", "cards": [{"q": "addict", "a": ["哎哟！上来就点了个“硬菜”！这个词考研英语一**完形填空和阅读理解**里都是老面孔，而且它完美踩中咱们上一讲的所有“火锅知识点”。来，咱把它拆了当“麻辣锅底”涮着吃！\n\n---\n\n**第一步：看“骨架”（词根）**\n\n- **dict** = **“说”**（speak）。这是锅底。\n- 证据：`dictionary`（词典）= 说（dict）事儿的地方；`predict`（预言）= 提前（pre-）说。\n\n---\n\n**第二步：看“蘸料”（前缀）**\n\n- **ad-** = **“朝…去/加强”**（注意！碰到d开头的词根，ad-会“同化”成ad-，但意思还是“去/往”）。\n- 所以 **ad + dict** = **“朝…去说”**。\n\n---\n\n**第三步：看“演化”（这步最精彩！）**\n\n你想想，“**朝某东西不停地说**”会咋样？\n- 古代罗马：法官**“判决”**时，会“对着犯人宣读”罪行 → 所以最初是 **“判刑/使沉溺”**（强制把某人交给法律）。\n- 后来演化：**“你被判决给某物”** → 你对它**毫无抵抗** → 就成了 **“上瘾/沉迷”**。\n\n**形象记忆（考研专用段子）：**  \n你每天早上**对着手机说**：“我就刷5分钟！”结果3小时过去了。手机对你“宣判”——**你被判决给手机了**，这就是 **addict**（上瘾）。你不是爱手机，你是被手机“判了无期徒刑”！\n\n---\n\n**第四步：词性全家桶（一个单词吃透）**\n\n| 词性 | 单词 | 例句（考研风格） |\n|------|------|----------------|\n| **动词** | **addict** (əˈdɪkt) | He **is addicted to** gaming.（注意！考研最爱考 **be addicted to**，这里的to是介词，后面跟名词/doing！） |\n| **名词（人）** | **addict** (ˈædɪkt) | a **TV addict**（电视迷）——指人。 |\n| **名词（现象）** | **addiction** | **Internet addiction**（网瘾）——考研英语一大作文绝对能用上！ |\n| **形容词** | **addictive** | Caffeine is **addictive**.（咖啡因让人上瘾。） |\n\n---\n\n**第五步：考研致命考点（敲黑板！）**\n\n1. **介词搭配**：`addict` 做动词时，99%考 **被动 + to**：`be addicted to`。**to是介词**！后面跟动词一定要加 **-ing**！  \n   ❌ 错：He is addicted to play games.  \n   ✅ 对：He is addicted to **playing** games.\n\n2. **词义感情色彩**：在考研阅读里，`addict` 不一定全是“吸毒/烟酒”那种严重上瘾。它经常**中性化**，表示“**对…痴迷/热衷**”。比如 `addicted to work`（工作狂）——作者不一定批判，可能只是描述现象。\n\n3. **同根词串烧**（考场上用来猜词）：  \n   - `contradict` = **反着（contra-）说** → 反驳/矛盾。  \n   - `dictate` = **不停地说** → 口述/命令/支配（听写也是它！）。  \n   - `verdict` = **真实（ver-）说** → 裁决（verdict）。\n\n---\n\n**给你的“一盘涮肉”作业：**\n\n试着翻译这句考研阅读高频改写句（别怕，拆着来）：  \n> **“People addicted to social media often find it hard to concentrate on their work.”**\n\n拆：  \n- `addicted to social media` = 对社交媒体上瘾的（修饰People）  \n- `find it hard to...` = 发现做…很难  \n- `concentrate on` = 集中注意力在…（还记得咱上回说的 `con-` 加强 + `centr` 中心吗？）  \n\n**答案：** “对社交媒体上瘾的人，常常发现自己很难集中注意力工作。”\n\n---\n\n**最后补一刀（助记口诀）：**  \n**“ad 朝前 dict 说，判决下来就上瘾；be addicted to 要记清，后面 doing 别用原形！”**  \n\n记住了没？下次再见到 `addict`，你就想象自己被“宣判”给了考研英语——哈哈，但你这不是上瘾，是**主动征服**！有下一个词没？尽管扔过来！🔥\n"]}]}, {"key": "addicted", "label": "addicted", "kind": "word", "cards": [{"q": "addicted", "a": ["哈哈，你搁这儿“卡bug”呢！上一讲刚说完 `addicted` 是 `addict` 的过去分词/形容词，你反手就把这个词单独拎出来——**聪明！** 因为这恰恰是考研英语一**最高频的“马甲”形态**，阅读里十次出现八次都是它！咱今天就把它当“特供单品”再涮一遍，保证你以后看见它就条件反射。\n\n---\n\n**第一口：认清它的“马甲”本质**\n\n`addicted` 不是新词，就是 `addict` 穿了件 **“-ed”牌小马甲**（形容词后缀，表示“被…的/处于…状态的”）。所以它的核心意思永远是：\n\n> **“被（某物）判刑了”→ 被牢牢捆住→ 沉迷的/上瘾的**\n\n但考研英语里，它**极少**指吸毒那种“上瘾”，90%是**心理层面的“离不开”**，比如：\n- `addicted to your smartphone`（离不开手机）\n- `addicted to the feeling of approval`（沉迷于被认可的感觉）——这句子是不是特像心理学类阅读？\n\n---\n\n**第二口：考研必杀技——“be addicted to”三连坑**\n\n这是考研完形填空和翻译的**高频命题点**，我直接给你拆成“三个雷区”，踩一个丢2分！\n\n| 雷区 | 错误示范 | 正确姿势 |\n|------|----------|----------|\n| **① to 是介词** | `be addicted to **do** sth` | `be addicted to **doing**`（to是介词！后面跟名词/动名词） |\n| **② 被动忘掉** | `He addicted to coffee.` | `He **is** addicted to coffee.`（必须带be动词，表示“被…所困”的状态） |\n| **③ 主语搞混** | `Coffee is addicted to him.` | 只有**有大脑的生物**才能被addicted！咖啡不会上瘾他，是他对咖啡上瘾。 |\n\n**记忆口诀（考场默念）：**  \n**“be addicted to doing，被动语态别忘记；to是介词不是不定式，doing动名词跟上去！”**\n\n---\n\n**第三口：考研阅读“换汤不换药”的变体**\n\n出题老头最爱干一件事——把 `addicted to` 换成它的“亲戚”，让你认不出来。来，我给你列个“家族谱”：\n\n| 表达 | 意思 | 考研出现频率 |\n|------|------|------------|\n| `be **hooked** on` | 被钩住→沉迷 | ⭐⭐⭐（口语化，但阅读里见过） |\n| `be **obsessed** with` | 被鬼迷心窍→痴迷 | ⭐⭐⭐⭐（高频！尤其心理学文章） |\n| `be **dependent** on` | 依赖（中性偏贬） | ⭐⭐⭐⭐⭐（经济类/科技类阅读的常客） |\n| `be **glued** to` | 被胶水粘住→目不转睛 | ⭐⭐（形象化表达，见到认识就行） |\n\n**重点：** 做阅读理解时，看到这些词，**统统按“addicted to”处理**，它们就是作者的“态度信号”——通常暗示“过度依赖→可能有负面影响”。\n\n---\n\n**第四口：实战演练（考研翻译题改编）**\n\n来，试着翻译这句（别查字典，拆着来）：\n\n> **“Modern consumers, addicted to the convenience of online shopping, are gradually becoming less tolerant of any delivery delay.”**\n\n**拆解步骤：**\n1. `addicted to the convenience` = 沉迷于便利（状态）\n2. `online shopping` = 网购的（修饰convenience）\n3. `gradually becoming` = 逐渐变得\n4. `less tolerant of` = 对…容忍度更低（`tolerant` 是 `tolerate` 的形容词）\n\n**参考答案：**  \n“现代消费者沉迷于网购的便利，逐渐对任何配送延迟变得容忍度更低。”\n\n（你看，这句里的 `addicted` 完全没提“上瘾”俩字，但意思就是“离不开了”——这就是考研翻译的“信达雅”！）\n\n---\n\n**最后送你个“防走神”画面：**\n\n下次背到 `addicted`，脑子里就蹦出**葛优躺刷手机**，旁边字幕写着：**“I am ADDICTED to this sofa and phone.”** 然后默默告诉自己——我背单词也要有这劲头，但我不 be addicted to 拖延，我 be addicted to **solving** 真题！💪\n\n下一个词，你来点！咱继续“涮”！\n"]}]}, {"key": "addiction", "label": "addiction", "kind": "word", "cards": [{"q": "addiction", "a": ["哎哟！你搁这儿“全家桶”集卡呢！`addict` → `addicted` → `addiction`，三连击啊！**太好了，咱今天就把这个“上瘾家族”一网打尽，让你以后看见它们任何一个，都跟看见自家亲戚一样亲。**\n\n---\n\n**第一步：认清 `addiction` 的“户口本”**\n\n- **词性**：**名词**（后缀 `-ion` 是“名场面”标志，表示“行为/状态/结果”）\n- **核心意思**：**“上瘾/沉迷/癖好”** 这件事本身，而不是“人”或“动作”。\n\n**形象记忆（火锅版）：**  \n`addict` 是“**被判刑的人**”（人），`addicted` 是“**被判刑的状态**”（形容词），而 **`addiction`** 就是“**那张判决书**”（名词）——它指代的是“上瘾”这个**事实/现象**。\n\n---\n\n**第二步：考研最爱考的“三大用法”**\n\n| 用法 | 例句 | 考点解析 |\n|------|------|----------|\n| **① 后接 `to`** | `His addiction **to** social media is serious.` | `addiction` 的搭配跟动词一样，**还是 `to`**！因为根儿上就是 `addict to` 变来的。 |\n| **② 作主语（现象描述）** | `Internet addiction has become a global concern.` | 考研阅读第一段常这样开篇，引出话题。 |\n| **③ 作宾语（具体对象）** | `He is trying to overcome his caffeine addiction.` | 可以具体化，比如 `drug/coffee/gambling addiction`。 |\n\n**敲黑板：** `addiction` 是**可数名词**！可以说 `an addiction to...` 或 `addictions`（多种癖好）。\n\n---\n\n**第三步：最容易踩的“坑”——和 `addict` 混用**\n\n很多同学写作文时，该用名词用了动词，该用动词用了名词。来，咱们用“一个故事三句话”把它分清：\n\n| 句子 | 解析 |\n|------|------|\n| `He **addicted** himself to gaming.` | **动词**（动作）——“他让自己沉迷于游戏。” |\n| `He **is addicted** to gaming.` | **形容词**（状态）——“他处于沉迷游戏的状态。” |\n| `His **addiction** to gaming ruined his health.` | **名词**（事实）——“他对游戏的沉迷毁了他的健康。” |\n\n**考场口诀（默念三遍）：**  \n**“动词自己干，形容词带be，名词前面加个the！”**\n\n---\n\n**第四步：考研阅读“同义替换”大礼包**\n\n出题老头最爱把 `addiction` 换成下面这些词，让你找不出原文对应。我给你列个“黑话对照表”：\n\n| 考研原文词 | 同义替换（选项/题干里） | 意思 |\n|------------|------------------------|------|\n| `addiction` | `dependence` | 依赖（更中性/偏贬） |\n| `addiction` | `obsession` | 痴迷（更强的心态色彩） |\n| `addiction` | `compulsion` | 强迫性冲动（偏心理学术语） |\n| `addiction to` | `craving for` | 渴求（偏生理/欲望） |\n\n**实战演练（阅读理解题）：**  \n原文：`His addiction to online shopping led to financial problems.`  \n题干选项：  \nA. His dependence on online shopping caused money issues. ✅  \nB. He is addicted to online shopping. ❌（这是改写，不是同义替换——题干问“什么导致了问题”，选项B说的是“他上瘾”这个状态，不是“问题”本身）\n\n---\n\n**第五步：写作加分句型（让你在考研作文里装个大的）**\n\n别只会写 `Many people are addicted to smartphones.`，来点高级的：\n\n| 小白写法 | 大神写法 | 亮点 |\n|----------|----------|------|\n| `Many people are addicted to smartphones.` | `The **addiction** to smartphones has become a **prevalent** phenomenon among young people.` | `prevalent` = 普遍的（高级词） |\n| `He can't stop playing games.` | `His **addiction** to gaming **deprives** him of sleep.` | `deprive sb of sth` = 剥夺（考研写作高频搭配） |\n\n**终极王炸句（背下来，作文直接套）：**  \n> `With the proliferation of digital devices, **addiction** to social media has emerged as a **pressing** issue in modern society.`  \n> （随着数字设备的激增，对社交媒体的沉迷已成为现代社会一个紧迫的问题。）\n\n---\n\n**最后送你“家族图谱”一次理清：**\n\n| 词 | 词性 | 意思 | 使用场景 |\n|----|------|------|----------|\n| `addict` | 动词/名词 | 使上瘾/上瘾的人 | 作谓语或指代人 |\n| `addicted` | 形容词 | 沉迷的 | 描述状态（常跟be） |\n| `addiction` | 名词 | 沉迷/瘾 | 指代现象或事实 |\n\n**一句话串起来：**  \n> `The **addict** (人) is so **addicted** (状态) to gaming that his **addiction** (事实) has ruined his life.`\n\n记住了没？现在你手里已经握着这家族的“户口本”了——`addict` 是“人”，`addicted` 是“状态”，`addiction` 是“事实”。下次再看见它们，你能三秒内反应出词性和用法，就算彻底拿下了！🎯\n\n下一个词，你点，我讲！\n"]}]}, {"key": "addictive", "label": "addictive", "kind": "word", "cards": [{"q": "addictive", "a": ["哈哈！**“上瘾家族”第四位成员来报到啦！** 你这一波“集卡式”提问，简直是把咱这个家族一网打尽啊！以后你考研上岸了，这个家族得给你发个“最佳团宠”奖状！🏆\n\n好，咱今天就把最后这块拼图 **`addictive`** 给涮了，保证你吃完这口，全家桶彻底毕业！\n\n---\n\n**第一步：先看“户口本”**\n\n- **词性**：**形容词**（后缀 `-ive` 是典型的“爱动词”标志，意思是“**有…倾向的/易…的**”）\n- **核心意思**：**“容易让人上瘾的 / 有成瘾性的”**\n\n**灵魂区别（一句话秒懂）：**\n- **`addicted`** 是 **“你自己被迷住了”**（你难受，你被动）。\n- **`addictive`** 是 **“这东西太迷人了”**（东西厉害，它主动）。\n\n**火锅版比喻：**\n- 你 `addicted` 了 = 你吃火锅辣得停不下来（你处于“被辣哭”的状态）。\n- 火锅 `addictive` = 这锅底加了罂粟壳（不是），**这玩意儿本身就有毒！** 闻一下就上头，谁吃谁迷糊。\n\n---\n\n**第二步：考研“致命”考点（完形填空常客）**\n\n这两个形容词在考研英语里是**最经典的“主动/被动”陷阱**，出题老头特别爱把这两个词混在选项里让你选。\n\n| 对比维度 | **Addicted** | **Addictive** |\n| :--- | :--- | :--- |\n| **中文意思** | 上瘾的（**感到**沉迷） | 令人上瘾的（**让人**沉迷） |\n| **主动/被动** | **被动**（人受到外界影响） | **主动**（事物本身的性质） |\n| **主语是谁** | 主语必须是 **人** / 动物 | 主语必须是 **事物** / 活动 |\n| **常见搭配** | `be addicted to sth` | `sth is addictive` |\n\n**考场口诀（默念）：**  \n**“人用ed，物用ive；ed表状态，ive表性质！”**\n\n---\n\n**第三步：实战演练（判断正误）**\n\n来，小白出招，你来判断下面哪句是**地道英语**，哪句是**中式英语**？\n\n- A. `I find this game very addictive.`  \n- B. `I find this game very addicted.`\n\n**答案与解析：**\n- **A ✅** （我发现这游戏很**让人上头** —— 形容游戏的性质，用 `addictive`。）\n- **B ❌** （如果非要用 `addicted`，得说 `I am addicted to this game.` 或者 `This game makes me addicted.` 不能直接说游戏本身“感到上瘾”，游戏又没有大脑！）\n\n---\n\n**第四步：考研阅读“同义替换”大礼包（写作装X必备）**\n\n阅读里不会老用 `addictive`，为了增加难度，老头们会换成这些“高级脸”词汇：\n\n| 替代词 | 意思 | 区别（装X指南） |\n| :--- | :--- | :--- |\n| **Compelling** | 引人入胜的 | 侧重于“强烈吸引，让你不得不看/做”。 |\n| **Alluring** | 诱人的 | 侧重于“勾引你”，带点“狐狸精”那种性感诱惑。 |\n| **Intriguing** | 引起好奇心的 | 侧重于“让你特别好奇，特想一探究竟”。 |\n| **Engrossing** | 令人全神贯注的 | 侧重于“让你完全沉浸其中，忘记时间”。 |\n\n**写作加分技巧：**  \n写作文想描述“手机游戏让人上瘾”，别总是 `Games are addictive.` 太普通了。你可以写：\n> `The **compelling** nature of mobile games often makes them highly **addictive** among teenagers.`  \n> （手机游戏的强吸引力往往使其在青少年中极具成瘾性。）\n\n---\n\n**第五步：最后串一遍“加特林家族”大合影！**\n\n来，看黑板，我们用**一条终极龙**把四个词全串进去，以后你写作文用到这个主题，直接套这个“全家桶”模板！\n\n> **“The reason why this game is so (1)_______ is that its designers use psychological tricks. Many (2)_______ players find it difficult to quit. Their (3)_______ to it has seriously affected their studies. In short, the game is extremely (4)_______.”**\n\n**答案：**\n1. **addictive** （游戏本身性质）\n2. **addicted** （玩家被动的状态）\n3. **addiction** （沉迷的这个现象/事实）\n4. **addictive** （总结强调游戏性质）\n\n---\n\n**恭喜你！** 你不仅搞定了四个单词，还顺手拆穿了考研英语“形容词主被动”的常见把戏！下次刷题再看到 `-ed` 和 `-ive` 结尾的词（比如 `interested` vs `interesting`，`excited` vs `exciting`），记得用今天这招“**人ed物ive**”去判断。\n\n怎么样，这波“家族专场”过瘾不？要不要再来点新词开开胃？随时等你点单！😎\n"]}]}, {"key": "dictate", "label": "dictate", "kind": "word", "cards": [{"q": "dictate", "a": ["哎呦！你终于跳出“上瘾家族”了！但是 **`dictate`** 这个词，你以为是新朋友？**它可是 `addict` 的“亲爹”啊！** 还记得咱第一讲说的吗？`addict` = `ad`（朝）+ `dict`（说）。咱今天就把这个 **`dict`（说）** 这个“锅底”单独拎出来，涮它个底朝天！\n\n---\n\n**第一步：先看“户口本”**\n\n- **词性**：**动词**（别被结尾的 `-ate` 骗了，`-ate` 既可以做动词后缀，也可以做名词/形容词后缀，但在这里是**动词**！）\n- **核心意思**：**“口述 / 命令 / 支配 / 强加”**\n\n**形象记忆（三连变脸）：**\n1. **口述**（最原始）：老师**说**（dict）一篇文章，学生照着写 → “听写”。\n2. **命令**（往上走）：老板**说**一嘴，你就得照办 → “命令/发号施令”。\n3. **支配**（再往上走）：情况**说了算** → “支配/决定”（比如 `Reason dictates that...` = 理性决定/表明…）\n\n---\n\n**第二步：考研三大高频考点（完形+翻译必看）**\n\n| 考点 | 例句 | 解析 |\n|------|------|------|\n| **① 听写** | `The teacher dictated a passage to the class.` | 最原始的意思，考研听力不考，但单词基础意思得认识。 |\n| **② 命令/强行规定** | `The rules dictate that we must arrive on time.` | **考研最爱！** 这里的 `dictate` 相当于 `require/stipulate`（规定）。 |\n| **③ 支配/决定** | `Common sense dictates that we should save money.` | **作文神句！** 表示“常理/逻辑表明…”，比 `suggest` 高级10倍。 |\n\n**考场口诀（默念）：**  \n**“dictate 有三变，口述命令和支配；后面常跟 that 从句，虚拟语气要注意！”**  \n（注意：当 `dictate` 表示“命令/规定”时，后面的 `that` 从句常用 **`should + 动词原形`** 或直接接动词原形——这是考研语法里的“虚拟语气”考点！比如：`The contract dictates that the work **be** completed by Friday.`）\n\n---\n\n**第三步：“dict”家族大乱斗（考研阅读串串烧）**\n\n你既然点到了 `dictate`，我必须把它的七大姑八大姨全拉出来让你认个脸熟，以后阅读遇到它们直接“秒杀”：\n\n| 单词 | 拆解 | 意思 | 考研出现频率 |\n|------|------|------|------------|\n| **predict** | `pre-`（提前）+ `dict`（说） | 预言/预测 | ⭐⭐⭐⭐⭐（科技类阅读常客） |\n| **contradict** | `contra-`（反）+ `dict`（说） | 反驳/与…矛盾 | ⭐⭐⭐⭐（议论文里的态度词） |\n| **verdict** | `ver-`（真实）+ `dict`（说） | 裁决/定论 | ⭐⭐⭐（法律类阅读） |\n| **indicate** | `in-`（里面）+ `dic`（说，变体）+ `-ate` | 表明/暗示 | ⭐⭐⭐⭐⭐（阅读题干高频词！） |\n| **dictionary** | `dict`（说）+ `-ion` + `-ary`（地方） | 词典（“说话的地方”） | ⭐⭐（基础词） |\n\n**终极串烧（一条龙记住全家）：**  \n> “法官的 **verdict**（裁决）**contradicts**（与…矛盾）了之前的证据，这 **indicates**（表明）案件可能有隐情。专家 **predict**（预测）这会影响公众信任，法律 **dictates**（规定）必须重新审理。”\n\n---\n\n**第四步：写作“王炸”句型（大作文直接套）**\n\n别再写 `I think` 了！考研作文里表示“我认为/常理认为”，用 `dictate` 直接拉满高级感：\n\n| 小白写法 | 大神写法 |\n|----------|----------|\n| `I think we should protect the environment.` | `Common sense **dictates** that we should protect the environment.` |\n| `The law says we must obey.` | `The law **dictates** that we (should) obey.` |\n| `The data shows that pollution is increasing.` | `The data **dictates** that pollution is on the rise.` |\n\n**考场加分句（背下来）：**  \n> `Ethics **dictate** that scientific research should prioritize human welfare over commercial interests.`  \n> （伦理准则规定，科学研究应把人类福祉置于商业利益之上。）\n\n---\n\n**第五步：实战小测验（判断对错）**\n\n- A. `The teacher dictated the students a passage.`  \n- B. `The teacher dictated a passage to the students.`\n\n**答案：**  \nA ❌（`dictate` 的正确搭配是 **`dictate sth to sb`**，不能直接说 `dictate sb sth`，它不是 `give` 那种双宾语动词！）  \nB ✅（这才对！）\n\n---\n\n**最后送你个“助记画面”：**\n\n想象你是《甄嬛传》里的**皇上**，你躺在床上**口述**（dictate）圣旨，旁边的太监**赶紧记**（听写）。你说“**给朕斩了**”（命令），太监照办（支配）——整个过程，是不是都是你那张 **“嘴”（dict）** 在起作用？\n\n**终极口诀（再念一遍）：**  \n**“dict 是张嘴，口述命令都靠它；predict 提前说，contradict 反着讲；verdict 最终定，indicate 暗表明！”**\n\n记住了没？`dictate` 这词你只要抓住“**权威人士用嘴发号施令**”这根主线，所有意思全通！下一个词，你来点！🔥\n"]}]}, {"key": "dictation", "label": "dictation", "kind": "word", "cards": [{"q": "dictation", "a": ["哎呦！你这“点菜”水平是越来越高了！**`dictation`** 这个词，看起来是 `dictate` 加了个尾巴，但实际上它 **不按常理出牌**！考研英语里，它极少考“听写”那个本意，反而更喜欢披着“马甲”出现在**法律、政治、学术类**阅读里。咱今天就把它这层“马甲”扒干净！\n\n---\n\n**第一步：先看“户口本”**\n\n- **词性**：**名词**（后缀 `-ion` 又是“名场面”，表示“行为/状态/结果”）\n- **核心意思**：**“口述 / 听写 / 命令 / 支配（的结果）”**\n\n**但注意！** 考研阅读里，**“听写”这个意思极少出现**（因为咱们不考听力！），它更常见的是下面这两个 **“高级黑”** 意思：\n\n| 意思 | 例句 | 出现场景 |\n|------|------|----------|\n| **① 命令/支配（行为）** | `He refused to act under dictation.` | 政治类阅读（拒绝在“被支配”下行动） |\n| **② 口述（的内容）** | `The secretary typed the dictation.` | 经济/职场类阅读（秘书打出口述内容） |\n\n**形象记忆（火锅版）：**  \n`dictate` 是“**张嘴发号施令**”这个动作（动词），而 **`dictation`** 就是“**从嘴里吐出来的那堆话/指令**”（名词），它可能是“圣旨”（命令），也可能是“老板的碎碎念”（口述内容）。\n\n---\n\n**第二步：考研阅读最爱的“神转折”用法**\n\n`dictation` 在考研英语一里，**90%的情况下**出现在一个固定搭配里：\n\n> **`under the dictation of...`** = **“在…的支配/指挥下”**\n\n**实战例句（摘自考研同源外刊风格）：**\n> `The company operated under the dictation of a handful of senior executives.`  \n> （这家公司在少数高管的支配下运营。）\n\n**记住这个画面：** 一群小兵 **under the dictation of** 将军 = 将军“口述”命令，小兵照做。所以这个词一旦出现，就暗示 **“控制/服从/不自由”** 的关系。\n\n---\n\n**第三步：和 `dictate` 的“角色分工”**\n\n有些同学分不清 `dictate` 和 `dictation` 到底有啥区别，咱用“一个场景两句话”把它焊死：\n\n| 词 | 词性 | 角色 | 例句 |\n|----|------|------|------|\n| `dictate` | **动词** | **发号施令**（动作） | `The CEO **dictates** the company's strategy.`（CEO发号施令） |\n| `dictation` | **名词** | **指令本身**（内容） | `The team follows the CEO's **dictation** blindly.`（团队盲目跟随CEO的指令） |\n\n**考场口诀（默念）：**  \n**“动词是动作，名词是内容；dictate 发令，dictation 令本身。”**\n\n---\n\n**第四步：写作避坑指南（别在作文里闹笑话）**\n\n写作文时，如果你想表达“听从…的建议/安排”，**千万别用** `under the dictation of`！因为这带有 **“被强行支配/不情愿”** 的贬义色彩。正确替换如下：\n\n| 想表达的意思 | ❌ 错误写法 | ✅ 正确写法 |\n|--------------|------------|------------|\n| 听从专家的建议 | `under the dictation of experts` | `following the advice of experts` |\n| 遵循传统 | `under the dictation of tradition` | `in line with tradition` |\n| 服从法律 | `under the dictation of law` | `in accordance with the law` |\n\n**一句话记住：** `dictation` 是“**被按着头听指令**”，不是“虚心听取建议”！\n\n---\n\n**第五步：“dict”家族再扩容（眼熟全系列）**\n\n现在你的“dict（说）家族”已经有这么多成员了，咱列个表一次复习一遍：\n\n| 单词 | 拆解 | 意思 | 考研频率 |\n|------|------|------|----------|\n| `dictate` | dict（说）+ -ate（动词） | 口述/命令/支配 | ⭐⭐⭐⭐ |\n| `dictation` | dict（说）+ -ation（名词） | 口述内容/命令/支配 | ⭐⭐⭐ |\n| `predict` | pre-（前）+ dict（说） | 预言/预测 | ⭐⭐⭐⭐⭐ |\n| `contradict` | contra-（反）+ dict（说） | 反驳/与…矛盾 | ⭐⭐⭐⭐ |\n| `verdict` | ver-（真）+ dict（说） | 裁决/定论 | ⭐⭐⭐ |\n| `indicate` | in-（里）+ dic（说）+ -ate | 表明/暗示 | ⭐⭐⭐⭐⭐ |\n\n**终极串烧（再来一条龙，这次把 `dictation` 加进去）：**  \n> `The judge's **verdict** (裁决) **dictated** (规定) a harsh sentence. The defendant's lawyer tried to **contradict** (反驳) it, claiming the ruling was made under the **dictation** (支配) of political pressure. Experts **predict** (预测) this case will **indicate** (表明) a shift in judicial fairness.`  \n> （法官的裁决规定了严厉的判决。被告律师试图反驳，声称该裁决是在政治压力的支配下做出的。专家预测此案将表明司法公正性的转变。）\n\n---\n\n**最后送你个“防混”画面：**\n\n想象你是**公司前台**，老板把你叫过去 **“dictate”**（口述）了一封长邮件，你赶紧用笔记下来，这张写满字的纸就是 **“dictation”**（口述内容）。你拿着这张纸去执行，就是 **“under the dictation of”**（在老板支配下）。\n\n**记住了：`dictation` 是“老板嘴里蹦出来的那堆字儿”，不是“听写考试”！**\n\n怎么样，这个“dict家族”你现在闭着眼都能画出族谱了吧？下一个词，你来点！🔥\n"]}]}, {"key": "predict", "label": "predict", "kind": "word", "cards": [{"q": "predict", "a": ["哎呦！**终于轮到 `predict` 了！** 这词可是考研英语阅读里的 **“顶流明星”** ，每年必出现，而且专爱在 **科技类、经济类、环境类** 文章里刷存在感。咱今天就把它当“招牌菜”好好涮一涮！\n\n---\n\n**第一步：先看“户口本”**\n\n- **拆解**：`pre-`（提前）+ `dict`（说）= **“提前说”**\n- **词性**：**动词**\n- **核心意思**：**“预言 / 预测 / 预知”**\n\n**形象记忆（火锅版）：**  \n你是**天气预报员**，你 **“提前说”（pre-dict）** 明天有雨，结果真下了——这就是 `predict`。它不是瞎蒙，而是**基于一定依据的“科学算命”**！\n\n---\n\n**第二步：考研最爱考的“三大用法”**\n\n| 用法 | 例句 | 考点解析 |\n|------|------|----------|\n| **① 接 that 从句** | `Experts **predict that** the economy will recover.` | **最最常见！** 后面跟整个句子。 |\n| **② 接名词/代词** | `It's hard to **predict the outcome**.` | 直接跟预测的对象（结果/趋势等）。 |\n| **③ 接 wh- 从句** | `We can't **predict what** will happen.` | 跟 what/when/whether 等。 |\n\n**考场口诀（默念）：**  \n**“predict 有三宝，that/名词/wh- 从句好！”**\n\n---\n\n**第三步：考研阅读“同义替换”大礼包（选择题保命）**\n\n出题老头最爱把原文的 `predict` 换成下面这些词，让你在选项里找对应。我直接给你列个“黑话对照表”：\n\n| 原文词 | 同义替换（选项里） | 意思 | 微妙区别 |\n|--------|-------------------|------|----------|\n| `predict` | **forecast** | 预测 | 侧重**天气/经济数据**的预测 |\n| `predict` | **project** | 预计/推算 | 侧重**基于当前数据推算未来** |\n| `predict` | **anticipate** | 预期/预料 | 侧重**心理上的期待+准备** |\n| `predict` | **foresee** | 预见 | 侧重**有先见之明**（偏褒义） |\n\n**实战技巧：** 做阅读时，看到题干里有 `predict`，回原文找 **`forecast/project/anticipate/foresee`** 这些词，答案大概率就在它们附近！\n\n---\n\n**第四步：写作“装X”句型（让阅卷老师眼前一亮）**\n\n别再写 `I think...` 或者 `Maybe...` 了！`predict` 在考研作文里是 **“高级表达神器”**：\n\n| 小白写法 | 大神写法 | 亮点 |\n|----------|----------|------|\n| `I think the environment will get worse.` | `Experts **predict** that the environment will **deteriorate** further.` | `deteriorate` = 恶化（高级词） |\n| `Maybe technology will change our lives.` | `It is **predicted** that technology will **reshape** our daily lives.` | 被动语态 + `reshape` = 重塑 |\n| `We don't know what will happen.` | `It is impossible to **predict with certainty** what the future holds.` | `with certainty` = 确定地（增加语气） |\n\n**考场王炸句（直接背）：**  \n> `Many economists **predict** that artificial intelligence will **revolutionize** the job market in the coming decades.`  \n> （许多经济学家预测，人工智能将在未来几十年彻底改变就业市场。）\n\n---\n\n**第五步：“predict”全家桶（一次性认全）**\n\n这词可不是孤家寡人，它有一堆“亲戚”你必须在阅读里能秒认：\n\n| 单词 | 拆解 | 词性 | 意思 | 考研频率 |\n|------|------|------|------|----------|\n| **predict** | pre-（前）+ dict（说） | 动词 | 预测/预言 | ⭐⭐⭐⭐⭐ |\n| **prediction** | predict + -ion | 名词 | 预测/预言（行为或结果） | ⭐⭐⭐⭐⭐ |\n| **predictable** | predict + -able（能…的） | 形容词 | **可预见的**（中性/偏贬） | ⭐⭐⭐⭐ |\n| **unpredictable** | un-（不）+ predictable | 形容词 | **不可预测的**（考研阅读最爱！） | ⭐⭐⭐⭐ |\n| **predictor** | predict + -or（人/物） | 名词 | 预测因子/指标（不是“人”，是“因素”！） | ⭐⭐⭐ |\n\n**考点预警：**  \n- **`predictable`** 在阅读里常带 **贬义/讽刺** 色彩，比如 `a predictable ending` = 一个“毫无悬念/老套”的结局。  \n- **`unpredictable`** 是考研阅读里的 **“态度词”** ，出现在环境/经济类文章里，通常表示“形势严峻/无法掌控”。比如 `unpredictable weather patterns` = 不可预测的天气模式（暗示气候变化严重）。\n\n---\n\n**第六步：实战小测验（判断正误）**\n\n- A. `The scientist predicted that the experiment would fail.`  \n- B. `The scientist predicted the experiment to fail.`\n\n**答案与解析：**  \nA ✅（`predict` 后面可以直接跟 `that` 从句，**从句里用过去将来时 `would fail`**。）  \nB ❌（`predict` 的搭配是 **`predict + that`** 或 **`predict + 名词`**，**不能**接 **`宾语 + to do`**！这是它和 `expect` 的区别——`expect sb to do` ✅，但 `predict sb to do` ❌！）\n\n---\n\n**最后送你个“助记画面”：**\n\n想象你是《哈利·波特》里的**特里劳妮教授**，她每天神神叨叨地 **“提前说”（pre-dict）** 各种预言——虽然大部分不靠谱，但偶尔准一次就封神。而考研阅读里的科学家们，就是**更靠谱的特里劳妮**，他们基于数据“提前说”未来趋势。\n\n**终极口诀（再念一遍）：**  \n**“pre 提前 dict 说，预测未来靠科学；predictable 太老套，unpredictable 才难搞；prediction 是名词，predictor 是指标！”**\n\n记住了没？`predict` 这词，你现在闭着眼都能用了吧？下一个词，你来点！🔥\n"]}]}, {"key": "predictability", "label": "predictability", "kind": "word", "cards": [{"q": "predictability", "a": ["哎呦！你这是要集齐 **“predict”全家桶** 啊！刚才集齐了 `predict`、`prediction`、`predictable`、`unpredictable`，现在又来了个 **`predictability`** ——这词可是考研英语一 **阅读理解态度题** 和 **完形填空逻辑题** 的“隐藏大Boss”！咱今天就把它掰开揉碎了，让你以后看见它，跟看见“1+1=2”一样亲切！\n\n---\n\n**第一步：先看“户口本”**\n\n- **拆解**：`predict`（预测）+ `-able`（能…的）+ `-ity`（名词后缀，表示“性质/状态”）\n  - `predictable` = “可预测的”（形容词）\n  - **`predictability`** = **“可预测性”（名词）**——指“能被提前说中”的**那种性质/程度**。\n- **词性**：**名词**（抽象名词，不可数）\n- **核心意思**：**“可预测性 / 可预见性”**\n\n**形象记忆（火锅版）：**  \n火锅的辣度如果是 **`predictable`**，那就是“每次辣度都一样，闭眼点都不踩雷”——这叫 **有“可预测性”（predictability）**。  \n但如果后厨师傅今天心情好放三斤辣椒，明天心情差放半斤——这就叫 **缺乏 predictability**（不可预测性），你每次吃都像开盲盒！\n\n---\n\n**第二步：考研阅读最爱考的“两大语境”**\n\n这个词在考研英语里**从不单独出现**，它必然出现在下面这两种“对立语境”中：\n\n| 语境 | 例句 | 文章类型 | 作者态度 |\n|------|------|----------|----------|\n| **① 赞扬 / 肯定** | `The predictability of the experiment's results increased its reliability.` | 科技类（实验/数据） | **正面**（可靠的） |\n| **② 批判 / 担忧** | `The predictability of traditional education methods fails to prepare students for an unpredictable world.` | 教育类/社会类 | **负面**（僵化/过时） |\n\n**考场口诀（默念）：**  \n**“predictability 是中性词，褒贬全看上下文！”**\n\n---\n\n**第三步：考研完形填空“逻辑信号词”用法**\n\n完形填空里，`predictability` 经常和下面这些词**成对出现**，作为“逻辑线索”：\n\n| 搭配词 | 逻辑关系 | 例句 |\n|--------|----------|------|\n| `lack of / low predictability` | 表 **“不确定性/风险”** | `The lack of predictability in the stock market frightens investors.` |\n| `high / strong predictability` | 表 **“稳定性/可靠性”** | `High predictability in weather forecasting saves lives.` |\n| `enhance / increase predictability` | 表 **“提高…的可预测性”** | `AI algorithms enhance the predictability of consumer behavior.` |\n| `reduce / undermine predictability` | 表 **“降低…的可预测性”** | `Policy changes reduce the predictability of the business environment.` |\n\n**考场技巧：** 完形填空里一旦出现 `predictability`，前后文大概率在讨论 **“稳定 vs 变化”** 或 **“确定 vs 不确定”** 的对立，选答案时往这方向靠就对了！\n\n---\n\n**第四步：和“兄弟姐妹”的“角色分工”**\n\n咱把 `predict` 家族全部拉出来，用“一个场景一句话”把它们焊死：\n\n| 词 | 词性 | 角色 | 例句 |\n|----|------|------|------|\n| **predict** | 动词 | **“预测”这个动作** | `Scientists **predict** climate change.` |\n| **prediction** | 名词 | **“预测”这个行为/结果** | `His **prediction** came true.` |\n| **predictable** | 形容词 | **“能被预测的”性质（修饰事物）** | `The ending is **predictable**.` |\n| **unpredictable** | 形容词 | **“不能被预测的”性质** | `The weather is **unpredictable**.` |\n| **predictability** | 名词 | **“可预测性”这种抽象性质/程度** | `The **predictability** of the system is low.` |\n\n**终极串烧（一条龙记住全家）：**  \n> `Scientists **predict** (动词) that AI will change our lives. Their **prediction** (名词) is based on data. However, the future is highly **unpredictable** (形容词), and the **predictability** (名词) of their models remains questionable.`  \n> （科学家预测AI将改变我们的生活。他们的预测基于数据。然而，未来高度不可预测，他们模型的可预测性仍存疑。）\n\n---\n\n**第五步：写作“王炸”句型（大作文直接用）**\n\n考研英语一大作文，不管考什么主题（科技/教育/环境/社会），你都可以用 `predictability` 来**升华主题**：\n\n| 小白写法 | 大神写法 | 适用主题 |\n|----------|----------|----------|\n| `The future is uncertain.` | `The **lack of predictability** in the job market poses a challenge to young graduates.` | 就业类 |\n| `Technology changes fast.` | `The low **predictability** of technological innovation forces companies to adapt constantly.` | 科技类 |\n| `We should protect the environment.` | `Climate change has **reduced the predictability** of agricultural production.` | 环境类 |\n\n**考场王炸句（直接背）：**  \n> `In an era of rapid change, the **declining predictability** of traditional career paths has prompted many young people to embrace lifelong learning.`  \n> （在一个快速变化的时代，传统职业道路日益降低的可预测性，已促使许多年轻人拥抱终身学习。）\n\n---\n\n**第六步：实战小测验（判断对错）**\n\n- A. `The predictability of this model is very high.`  \n- B. `This model has a high predictability.`\n\n**答案与解析：**  \nA ✅（`predictability` 是不可数名词，但可以用 `high/low` 等程度词修饰，表示“可预测性高低”。）  \nB ✅（也可以这样说！`have a high predictability` 也是地道的表达，这里的 `a` 不是“一个”，而是表示“一种…的性质”，是抽象名词的具体化用法。）\n\n---\n\n**最后送你个“助记画面”：**\n\n想象你每天**早上8点**准时被楼下的**广场舞音乐**吵醒——这闹钟的 **`predictability`**（可预测性）简直满分！突然有一天，音乐没响，你反而**睡不着了**——这就是“失去 predictability”带来的**不安感**。\n\n考研阅读里，作者写 `predictability` 时，往往就在制造这种 **“稳定 vs 混乱”** 的张力——你抓到这层，态度题就稳了！\n\n**终极口诀（再念一遍）：**  \n**“predictability 是性质，可预测性用名词；high/low 来修饰，lack of 表示不确定；完形填空找逻辑，阅读态度看褒贬！”**\n\n记住了没？你现在已经是 **“predict家族”** 的荣誉族长了！下一个词，你来点！🔥\n"]}]}, {"key": "predictable", "label": "predictable", "kind": "word", "cards": [{"q": "predictable", "a": ["哎呦！你这是要把 **“predict 家族”** 连根拔起啊！刚才 `predictability` 那个“抽象大boss”都干掉了，现在轮到它的“亲弟弟” **`predictable`** 了——这词在考研英语里可是个 **“戏精”** ，表面意思单纯，但暗地里藏着 **“褒贬两面派”** 的本事！咱今天就把它扒个底朝天！\n\n---\n\n**第一步：先看“户口本”**\n\n- **拆解**：`predict`（预测）+ `-able`（能…的/可…的）= **“能被提前说的”**\n- **词性**：**形容词**\n- **核心意思**：**“可预见的 / 可预料的 / 意料之中的”**\n\n**形象记忆（火锅版）：**  \n你每次去那家火锅店，**点微辣**，端上来永远是你熟悉的那个辣度——这叫 **`predictable`**（可预见的）。但要是后厨师傅今天手抖多放了两勺辣椒，你被辣哭——这就叫 **`unpredictable`**（不可预见的）。\n\n---\n\n**第二步：考研阅读里的“双重人格”**\n\n这词最骚的地方在于——它**本身中性**，但考研阅读里**90%的情况下带贬义**！因为老外觉得“可预测”=“没新意/老套/无聊”。\n\n| 人格 | 语境 | 例句 | 感情色彩 |\n|------|------|------|----------|\n| **① 中性（科技/数据类）** | 描述规律/结果稳定 | `The experiment yielded **predictable** results.` | **客观陈述**（无褒贬） |\n| **② 贬义（人文/社会类）** | 批评缺乏创意/老套 | `The movie's plot was utterly **predictable**.` | **带嫌弃**（无聊/俗套） |\n\n**考场口诀（默念）：**  \n**“说科学数据，它是中性；说故事情节，它是在骂人！”**\n\n---\n\n**第三步：考研完形填空“逻辑陷阱”**\n\n完形填空里，`predictable` 经常和下面这些词**成对出现**，作为“态度信号”：\n\n| 搭配词 | 意思 | 逻辑方向 | 例句 |\n|--------|------|----------|------|\n| `all too predictable` | **太老套了**（带嫌弃） | **负面** | `The ending was **all too predictable**.` |\n| `hardly predictable` | **几乎不可预测** | **中性/偏负** | `The outcome was **hardly predictable**.` |\n| `perfectly predictable` | **完全可以预测** | **中性**（科技类）或**负面**（故事类） | `The reaction was **perfectly predictable**.` |\n\n**考场技巧：** 看到 `predictable` 修饰 **剧情/行为/反应/结局**时，大概率作者在**吐槽**；修饰 **数据/结果/趋势**时，大概率是**客观陈述**。\n\n---\n\n**第四步：和“兄弟姐妹”的“角色分工”**\n\n咱再复习一遍 `predict` 家族，这次把 `predictable` 焊死在表格里：\n\n| 词 | 词性 | 角色 | 例句 |\n|----|------|------|------|\n| **predict** | 动词 | **“预测”这个动作** | `Experts **predict** a recession.` |\n| **prediction** | 名词 | **“预测”这个行为/结果** | `His **prediction** was wrong.` |\n| **predictable** | 形容词 | **“能被预测的”性质（修饰事物）** | `The plot is **predictable**.` |\n| **unpredictable** | 形容词 | **“不能被预测的”性质** | `The weather is **unpredictable**.` |\n| **predictability** | 名词 | **“可预测性”这种抽象性质** | `The **predictability** of the system is high.` |\n\n---\n\n**第五步：写作“避坑”指南（别在作文里闹笑话）**\n\n写考研作文时，如果你想表达 **“意料之中的”** ，千万别无脑用 `predictable`——因为老外第一反应可能是 **“无聊/俗套”** ！正确的“高级替换”如下：\n\n| 你想表达的意思 | ❌ 错误写法（会让人误会） | ✅ 正确写法 |\n|----------------|-------------------------|------------|\n| 意料之中的结果 | `a predictable result`（可能被理解为“没新意”） | `an **expected** result` |\n| 可预见的趋势 | `a predictable trend`（中立，勉强可用） | `a **discernible** trend`（可辨别的趋势） |\n| 理所当然的反应 | `a predictable reaction`（可能被理解为“毫无惊喜”） | `an **inevitable** reaction`（不可避免的） |\n\n**考场王炸句（直接背，既安全又高级）：**  \n> `While some argue that technological progress is **predictable**, others contend that it often defies expectations.`  \n> （虽然一些人认为技术进步是可预测的，但其他人认为它常常出乎意料。）  \n> ——这里用 `predictable` 是**中立陈述**，后面用 `defies expectations` 形成对比，既安全又显水平！\n\n---\n\n**第六步：实战小测验（判断对错）**\n\n- A. `The movie was so predictable that I fell asleep.`  \n- B. `The predictable weather patterns help farmers plan their crops.`\n\n**答案与解析：**  \nA ✅（说电影“可预测”= 老套，带嫌弃，正确。）  \nB ✅（说天气模式“可预测”= 稳定/可靠，中性偏褒，正确。）\n\n**两道题都对！** 关键看**修饰的对象**和**上下文态度**。\n\n---\n\n**最后送你个“助记画面”：**\n\n想象你去看《复仇者联盟》——开场五分钟你就猜到**钢铁侠会复活、灭霸会被打败**——这就是 **`predictable`**（老套/没惊喜）。  \n但如果你看的是《盗梦空间》，看到最后一秒还在懵逼——这就是 **`unpredictable`**（神作/意想不到）。\n\n考研阅读里，作者一旦用 `predictable` 形容某个社会现象/教育模式/故事情节，**八成是在讽刺它“毫无新意”**——你抓住这层，态度题直接拿捏！\n\n**终极口诀（再念一遍）：**  \n**“predictable 两面派，数据科学它中立；人文社科它吐槽，老套无聊别意外！”**\n\n记住了没？你现在已经是 **“predict家族”** 的“族长”了！下一个词，你来点！🔥\n"]}]}, {"key": "predictably", "label": "predictably", "kind": "word", "cards": [{"q": "predi c ta b l y", "a": ["哎呦！你真是太会点了！这词儿是 `predictable` 的亲兄弟——**`predictably`**（你打的时候手滑了哈，中间没有空格，是 p-r-e-d-i-c-t-a-b-l-y）。咱今天就把它“扒皮抽筋”，让你以后看见 **-ly** 结尾的词，就跟看见“地”字一样亲切！\n\n---\n\n**第一步：先看“户口本”**\n\n- **拆解**：`predictable`（可预测的）+ `-ly`（副词后缀）= **“可预测地 / 不出所料地”**\n- **词性**：**副词**\n- **核心意思**：**“正如所预料的 / 果不其然”**\n\n**形象记忆（火锅版）：**  \n你每次涮毛肚都**“七上八下”**，结果果然又嫩又脆——你可以说：**`Predictably`**，这毛肚好吃到爆！  \n（因为它总是如你所料地好吃！）\n\n---\n\n**第二步：考研阅读里的“神角色”**\n\n这词在阅读里不是“主角”，但它是 **“金牌气氛组”**！它不负责传达主要信息，只负责 **“递话茬儿”** ，引出作者认为 **“理所当然 / 毫不意外”** 的事情。\n\n**两大出场姿势：**\n\n| 姿势 | 位置 | 作用 | 例句 |\n| :--- | :--- | :--- | :--- |\n| **① 句首（状语）** | 放句子最前面，加逗号 | **总体评价**：作者觉得这件事“果然如此” | **`Predictably`**, the lazy student failed the exam. |\n| **② 动词前（状语）** | 放在实义动词前面 | **修饰动作**：这个动作的发生“毫不意外” | The lazy student **predictably** failed the exam. |\n\n---\n\n**第三步：考研完形填空“逻辑信号词”用法**\n\n在完形填空里，`predictably` 是个 **“态度信号弹”** ——它一出现，就意味着作者要 **“补刀”** 了！往往前面说了一件事，后面用 `predictably` 引出 **“果然不出我所料”** 的坏结果。\n\n**真题模拟语境：**\n> `The government cut funding for education. **Predictably**, the quality of teaching declined sharply.`\n> （政府削减了教育经费。**果不其然**，教学质量急剧下降。）\n\n**口诀：**  \n**“前面挖坑，后面踩雷；predictably 一出现，坏事它就紧相随！”**\n\n（注意：虽然“好结果”也能用，但考研阅读里 **80% 的情况** 后接的都是 **负面/消极** 的结果，因为作者总喜欢“吐槽”！）\n\n---\n\n**第四步：和“兄弟姐妹”的最后一次“全家福”**\n\n这次真是集齐了，咱们用 **“一条龙”** 把整个 `predict` 家族按“词性”排排坐：\n\n| 单词 | 词性 | 意思 | 考研出现频率 |\n| :--- | :--- | :--- | :--- |\n| **predict** | 动词 | 预测（动作） | ⭐⭐⭐⭐⭐ |\n| **prediction** | 名词 | 预测（结果/行为） | ⭐⭐⭐⭐⭐ |\n| **predictable** | 形容词 | 可预测的（修饰名词） | ⭐⭐⭐⭐ |\n| **unpredictable** | 形容词 | 不可预测的 | ⭐⭐⭐⭐ |\n| **predictability** | 名词 | 可预测性（抽象性质） | ⭐⭐⭐ |\n| **predictably** | 副词 | 果不其然地（修饰动词/句子） | ⭐⭐⭐ |\n\n---\n\n**第五步：实战小测验（秒懂版）**\n\n你能分清下面这两句的微妙区别吗？\n\n- A. `It is **predictable** that he will come late.`\n- B. `He will, **predictably**, come late.`\n\n**答案与解析：**\n- **A 句**：`predictable` 是形容词，放在 `It is ... that` 句型里，意思是 **“他迟到这件事本身是可以预见的”**（客观陈述）。\n- **B 句**：`predictably` 是副词，插在句中，意思是 **“果不其然，他又迟到了”**（带点“我就知道会这样”的嫌弃语气）。\n\n**记住：** `predictable` 说 **“事”**，`predictably` 说 **“果”**。\n\n---\n\n**最后送你个“助记画面”：**\n\n你舍友每次说 **“我就刷五分钟手机”**，结果**果不其然（Predictably）**，三个小时后他还瘫在床上傻笑。  \n——这时候你就可以用 `predictably` 来吐槽他，是不是特别解气？\n\n**终极口诀（告别仪式）：**  \n**“副词 -ly 真神奇，修饰动词和句子；predictably 表果然，吐槽打脸最给力！”**\n\n恭喜你，你现在已经彻底拿下 **`predict` 六脉神剑**了！从动词到名词，从形容词到副词，全家整整齐齐！下一个单词想翻谁的牌子？随时等你“点菜”！🔥\n"]}]}, {"key": "prediction", "label": "prediction", "kind": "word", "cards": [{"q": "prediction", "a": ["哎呦！**`prediction`** 来了！这词可是 `predict` 家族的 **“大管家”** ，考研英语里它比 `predict` 本人还爱露脸——**阅读里到处都是它的身影，作文里更是“高级词汇”的扛把子！** 咱今天就把它彻底焊死在脑子里！\n\n---\n\n**第一步：先看“户口本”**\n\n- **拆解**：`predict`（预测）+ `-ion`（名词后缀，表“行为/状态/结果”）= **“预测这个行为 / 预测的结果”**\n- **词性**：**名词**（可数/不可数都行）\n- **核心意思**：**“预言 / 预测 / 预报”**\n\n**形象记忆（火锅版）：**  \n`predict` 是 **“你掐指一算”** 那个动作（动词），而 **`prediction`** 就是 **“你算出来的那卦”**（名词）——可能是“明天有雨”这条**天气预报**，也可能是“中国队会赢”这个**预言**。\n\n---\n\n**第二步：考研阅读里的“高频角色”**\n\n这词在阅读里**从不单打独斗**，它永远跟着下面这些“老搭档”一起出现：\n\n| 搭档类型 | 高频搭配 | 例句 | 出现场景 |\n|----------|----------|------|----------|\n| **① 做出预测** | `make a prediction` | `It's risky to **make predictions** about the future.` | 科技/经济类 |\n| **② 证实预测** | `confirm/verify a prediction` | `The data **confirmed** the scientist's prediction.` | 实验/数据类 |\n| **③ 推翻预测** | `overturn/refute a prediction` | `The results **refuted** earlier predictions.` | 学术争议类 |\n| **④ 准确预测** | `accurate/reliable prediction` | `Accurate **predictions** are crucial for disaster prevention.` | 环境/气候类 |\n\n**考场口诀（默念）：**  \n**“make 预测，confirm 验证，refute 推翻，accurate 最靠谱！”**\n\n---\n\n**第三步：考研完形填空“固定搭配”陷阱**\n\n完形填空里，`prediction` 经常和 **介词 `of` / `about`** 搭配，但这两个意思有细微差别，出题老头就爱在这挖坑！\n\n| 搭配 | 意思 | 用法 | 例句 |\n|------|------|------|------|\n| **prediction of + 名词** | 对…的预测（**具体对象**） | 后面跟**具体事物** | `a **prediction of** an economic crisis`（对经济危机的预测） |\n| **prediction about + 名词** | 关于…的预测（**广泛话题**） | 后面跟**抽象领域** | `a **prediction about** the future of AI`（关于AI未来的预测） |\n\n**考场技巧：** \n- 如果后面是 **具体事件**（地震/危机/结果）→ 用 **`of`**\n- 如果后面是 **模糊领域**（未来/趋势/发展）→ 用 **`about`**\n\n**例题（完形填空模拟）：**  \n> `The scientist made a bold _____ the outcome of the experiment.`  \nA. prediction of ✅（具体结果，用of）  \nB. prediction about ❌（不具体，不匹配）\n\n---\n\n**第四步：写作“王炸”句型（大作文直接套）**\n\n考研作文里，别只会写 `I think...` 或 `Maybe...`，用 `prediction` 拉满高级感：\n\n| 小白写法 | 大神写法 | 亮点 |\n|----------|----------|------|\n| `I think the economy will get better.` | `**Predictions** about economic recovery remain optimistic.` | 名词作主语 + 被动感 |\n| `We cannot know the future.` | `It is difficult to make **predictions** about the distant future.` | 形式主语 + 高级词汇 |\n| `Many people say that AI will change the world.` | `There is a growing **prediction** that AI will revolutionize the world.` | There be 句型 + 同位语从句 |\n\n**考场王炸句（直接背）：**  \n> `Despite the widespread **prediction** that automation will eliminate jobs, others argue that it will create new opportunities.`  \n> （尽管人们普遍预测自动化会消除就业岗位，但其他人认为它会创造新机遇。）  \n> ——这句里用了 **`prediction + that 同位语从句`**，是考研作文的**满分结构**！\n\n---\n\n**第五步：和“兄弟姐妹”的“最终全家福”**\n\n这次咱把所有 `predict` 家族成员按 **“使用场景”** 分类，让你写作文时随手挑：\n\n| 想表达的意思 | 该用哪个词 | 词性 | 例句 |\n|--------------|-----------|------|------|\n| 我要**预测**某事 | `predict` | 动词 | `Experts **predict** a recession.` |\n| 这是个**预测**（行为/结果） | `prediction` | 名词 | `This **prediction** turned out to be true.` |\n| 这个结果是**可预测的** | `predictable` | 形容词 | `The outcome was **predictable**.` |\n| 这事情**果不其然**发生了 | `predictably` | 副词 | `**Predictably**, he arrived late.` |\n| 这个系统的**可预测性**很高 | `predictability` | 名词 | `The system has high **predictability**.` |\n\n---\n\n**第六步：实战小测验（判断对错）**\n\n- A. `His prediction about the earthquake saved many lives.`  \n- B. `His prediction of the earthquake saved many lives.`\n\n**答案与解析：**  \nA ❌（`prediction about` 后面跟**抽象话题**，但地震是**具体事件**，应该用 `of`。）  \nB ✅（`prediction of` 后面跟**具体事件**，正确！）\n\n---\n\n**最后送你个“助记画面”：**\n\n想象你是**天气预报员**，每天早上对着镜头**口播**（`predict` 动词）：“明天有雨！”——这句**播报内容**就是 **`prediction`**（名词）。如果连续三天你都播“明天有雨”但次次都准，那你这 **`prediction`** 就太 **`accurate`**（准确）了，领导都得给你加鸡腿！\n\n**终极口诀（告别仪式）：**  \n**“prediction 是名词，预测行为与结果；make/confirm/refute 常搭配，of 接具体 about 接话题！”**\n\n记住了没？你现在已经是 **`predict` 家族**的“太上皇”了！从动词到名词、形容词、副词，全家整整齐齐！下一个词，你来点！🔥\n"]}]}, {"key": "unpredictable", "label": "unpredictable", "kind": "word", "cards": [{"q": "unpredictable", "a": ["哎呦！**`unpredictable`** 终于来了！这可是 `predict` 家族的 **“叛逆小儿子”** ，考研英语阅读里它一出现，**作者的态度十有八九要“变天”**——不是担忧就是批判，要不就是在制造紧张气氛！咱今天就把它这个“刺头”给捋顺了！\n\n---\n\n**第一步：先看“户口本”**\n\n- **拆解**：`un-`（不）+ `predict`（预测）+ `-able`（能…的）= **“不能提前说的”**\n- **词性**：**形容词**\n- **核心意思**：**“不可预测的 / 变幻莫测的 / 难以预料的”**\n\n**形象记忆（火锅版）：**  \n你每次去那家火锅店点**微辣**，结果今天咸死、明天淡死、后天辣哭——这火锅的发挥 **`unpredictable`** 到了极点！你永远不知道下一口是“天堂”还是“地狱”。\n\n---\n\n**第二步：考研阅读里的“态度信号弹”**\n\n这个词在考研英语里**99%带负面色彩**！因为它暗示 **“失控 / 风险 / 焦虑”**。作者只要用它，基本就是在表达 **“这事儿不靠谱 / 让人头疼”**。\n\n| 语境 | 例句 | 文章类型 | 作者态度 |\n|------|------|----------|----------|\n| **① 环境/气候** | `Unpredictable weather patterns threaten crop yields.` | 环境类 | **担忧**（粮食安全受威胁） |\n| **② 经济/市场** | `The stock market is highly unpredictable.` | 经济类 | **警惕**（投资风险高） |\n| **③ 科技/未来** | `The unpredictable nature of AI raises ethical concerns.` | 科技类 | **批判/反思**（需谨慎） |\n| **④ 人性/行为** | `His unpredictable temper made him difficult to work with.` | 人文类 | **负面评价**（不靠谱） |\n\n**考场口诀（默念）：**  \n**“unpredictable 一出现，作者心里在发颤；环境经济加科技，通通都是负面判！”**\n\n---\n\n**第三步：考研完形填空“逻辑信号词”用法**\n\n完形填空里，`unpredictable` 经常和下面这些词 **“打配合”** ，构成 **“因果/转折”** 逻辑链：\n\n| 搭配词 | 逻辑关系 | 例句 |\n|--------|----------|------|\n| `due to / because of` | **原因**（因为不可预测，所以…） | `Due to **unpredictable** weather, the harvest failed.` |\n| `despite / although` | **转折**（尽管不可预测，但仍然…） | `Despite its **unpredictable** nature, investing remains popular.` |\n| `lead to / result in` | **结果**（不可预测导致…） | `The **unpredictable** market led to huge losses.` |\n\n**考场技巧：** 看到 `unpredictable`，前后文大概率在讲 **“问题/风险/挑战”** ，选答案时往 **“负面结果”** 方向靠就对了！\n\n---\n\n**第四步：和“兄弟姐妹”的“最终大乱斗”**\n\n咱把 `predict` 家族里所有带 **“褒贬”** 色彩的词拉出来，一次性分清：\n\n| 单词 | 感情色彩 | 使用场景 |\n|------|----------|----------|\n| `predictable` | **中性偏贬**（说人/事“老套”时带嫌弃） | 剧情/行为/结果 |\n| **`unpredictable`** | **铁定贬义**（暗示“风险/失控”） | 天气/市场/人性 |\n| `predictability` | **中性**（客观描述“可预测性”高低） | 系统/模型/数据 |\n| `predictably` | **中性偏贬**（“果不其然”常接坏事） | 引出意料之中的负面结果 |\n\n**终极串烧（一条龙感受“褒贬温差”）：**  \n> `The weather in this region is highly **unpredictable** (贬：让人头疼). Farmers miss the **predictability** (中性：客观描述) of traditional seasons. **Predictably** (贬：果然没好话), crop failures have become more frequent.`  \n> （这个地区的天气极不可预测。农民们怀念传统季节的可预测性。果不其然，农作物歉收变得更加频繁。）\n\n---\n\n**第五步：写作“避坑”指南（别用错地方！）**\n\n写考研作文时，如果你想表达 **“变化多端”** ，千万别不分场合地用 `unpredictable`——因为它太 **“丧”** 了！正确的“高级替换”如下：\n\n| 你想表达的意思 | ❌ 错误写法（太负面） | ✅ 正确写法（中性/正面） |\n|----------------|---------------------|------------------------|\n| 生活充满变化 | `Life is unpredictable.`（暗示“人生艰难”） | `Life is full of **diversity**.` |\n| 科技发展迅速 | `Technology is unpredictable.`（暗示“科技失控”） | `Technology is **evolving rapidly**.` |\n| 市场波动大 | `The market is unpredictable.`（暗示“投资危险”） | `The market is **volatile**.`（中性偏专业） |\n\n**考场王炸句（直接背，又安全又高级）：**  \n> `In an era of **unpredictable** global challenges, adaptability has become a crucial skill for individuals and nations alike.`  \n> （在一个充满不可预测的全球挑战的时代，适应能力已成为个人和国家的关键技能。）  \n> ——这里用 `unpredictable` 修饰 **“挑战”** ，完美匹配负面语境，还顺便带出“适应能力”这个正能量主题，形成 **“先抑后扬”** 的写作结构！\n\n---\n\n**第六步：实战小测验（判断对错）**\n\n- A. `The unpredictable weather ruined our travel plans.`  \n- B. `She has an unpredictable smile that brightens everyone's day.`\n\n**答案与解析：**  \nA ✅（天气不可预测 → 毁掉计划，负面语境，正确。）  \nB ❌（微笑不可预测 → 正常人不会这么夸人！这听起来像“她随时可能冷笑或狞笑”，应该用 **`infectious`**（有感染力的）或 **`warm`**。）\n\n---\n\n**最后送你个“助记画面”：**\n\n想象你前女友/前男友的**情绪**——上一秒晴空万里，下一秒电闪雷鸣，你永远猜不到TA下一秒要干嘛。这种 **`unpredictable`** 的脾气，最终把你们的关系搞黄了（负面结果实锤）。\n\n再想象考研英语阅读里，作者只要写出 `unpredictable`，你就自动脑补 **“作者在皱眉摇头”** 的画面——这样你就永远不会误判作者态度了！\n\n**终极口诀（告别仪式）：**  \n**“un- 打头表否定，predictable 变叛逆；阅读出现准没好事，环境经济加危机；写作慎用别乱夸，形容挑战最给力！”**\n\n记住了没？你现在已经是 **`predict` 家族**的“全科状元”了！从动词到名词、形容词、副词，连“叛逆小儿子”都被你驯服了！下一个词，你来点！🔥\n"]}]}, {"key": "be动词疑问", "label": "be动词疑问", "kind": "topic", "cards": [{"q": "上面第四口实战演练的句子，addicted to之前为什么没有be动词了。能给我讲解一下吗", "a": ["哎呦！火眼金睛啊！这个问题**问到根儿上了**，绝对是考研英语语法里的“隐形考点”。很多同学背了“be addicted to”就死板地认为它必须跟 be 动词绑死，结果一看阅读里光秃秃一个 `addicted to` 直接懵圈。\n\n来，咱不讲术语，继续用“火锅”给你整明白：\n\n---\n\n**核心答案：这不是“省略”，这是“变身”！**\n\n`addicted` 本质上是个**形容词**（不是动词！）。形容词在句子里有两个“工位”：\n\n| 工位 | 英文术语 | 例子 | 特点 |\n|------|----------|------|------|\n| **工位①** | 表语（放be动词后面） | He **is** addicted. | 有be动词，作谓语 |\n| **工位②** | 定语（放名词前面/后面） | The man **addicted to games**... | **没**be动词，作修饰成分 |\n\n你问的那句话：\n> **“Modern consumers, addicted to the convenience of online shopping, are gradually becoming...”**\n\n这里的 `addicted to...` 是**工位②**——它**作定语**，修饰前面的 `Modern consumers`，相当于一个**形容词短语**插在主语和谓语之间。**这时候不需要be动词**，因为它不是“主谓宾”里的谓语，而是“主（定语）谓宾”里的定语！\n\n---\n\n**形象比喻（考研专用段子）：**\n\n把 `addicted` 想象成一件**“沉迷牌”马甲**：\n- **工位①（有be）**：你**穿着**这件马甲 → “I **am** addicted.”（强调状态）\n- **工位②（无be）**：你**穿着这件马甲走进教室** → “The student **addicted to games** failed the exam.”（马甲只是描述你的身份，重点是你挂科了！）\n\n---\n\n**三大“无be”高频场景（考研阅读必见）**\n\n| 场景 | 例句 | 解析 |\n|------|------|------|\n| **1. 定语后置（最常见）** | `People **addicted to smoking** often ignore warnings.` | `addicted to smoking` 修饰 `People`，相当于 `People who are addicted to smoking` |\n| **2. 状语（表原因/条件）** | `**Addicted to the phone**, he forgot the time.` | 相当于 `Because he was addicted to the phone...` |\n| **3. 宾语补足语** | `We found him **addicted to gambling**.` | 相当于 `him` 处于 `addicted` 的状态（find + 宾语 + 形容词补足语） |\n\n---\n\n**考场救命判断法（只问自己两个问题）：**\n\n1. **`addicted to...` 前面有没有名词/代词？**  \n   → 有 → 多半是**定语**，**不加be**！  \n   → 没有 → 多半是**谓语**，**要加be**！\n\n2. **去掉 `addicted to...` 句子还完整吗？**  \n   - 完整（如 `Modern consumers... are becoming...`）→ 它是**附加修饰**，不加be！  \n   - 不完整（如 `He ___ addicted to coffee.`）→ 缺谓语，必须加 `is`！\n\n---\n\n**给你出个小测验（秒懂版）：**\n\n判断下面两句哪句对，哪句错，为什么？\n\n- A. `The boy addicted to computer games is my brother.`  \n- B. `The boy is addicted to computer games is my brother.`\n\n**答案：**  \nA ✅（`addicted to...` 作定语修饰 `the boy`，不需要be）  \nB ❌（`is addicted` 已经是谓语了，后面又冒出一个 `is my brother`，双谓语——**这是考研改错题的经典陷阱！**）\n\n---\n\n**最后一句“人话”总结：**\n\n**`addicted` 是形容词，不是动词。它要不要be动词，不取决于它自己，取决于它在句子里是“唱主角”（作谓语）还是“跑龙套”（作定语/状语）。** 阅读里看到没be的 `addicted to`，别慌——它就是“身上贴了张沉迷标签”的名词，标签不耽误人家干正事儿！\n\n现在回头看咱那句实战句子，是不是清晰得像玻璃似的？下一个问题，尽管扔过来！🔥\n"]}]}]}]};

let curSubject = "all";
let curEntry = null;

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inline(t){
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return t;
}
function tableHtml(rows){
  var split = function(r){ return r.replace(/^\||\|$/g,"").split("|").map(function(c){return c.trim();}); };
  var head = split(rows[0]);
  var h = "<table><thead><tr>" + head.map(function(x){return "<th>"+inline(x)+"</th>";}).join("") + "</tr></thead><tbody>";
  for(var j=2; j<rows.length; j++){
    var cells = split(rows[j]);
    h += "<tr>" + cells.map(function(c){return "<td>"+inline(c)+"</td>";}).join("") + "</tr>";
  }
  return h + "</tbody></table>";
}
function md(t){
  var lines = t.split(/\r?\n/);
  var html = "", i = 0;
  while(i < lines.length){
    var line = lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    if(/^---+$/.test(line.trim())){ html += "<hr>"; i++; continue; }
    if(line.trim().charAt(0) === "|"){
      var rows = [];
      while(i < lines.length && lines[i].trim().charAt(0) === "|"){ rows.push(lines[i].trim()); i++; }
      html += tableHtml(rows);
      continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      var ul = [];
      while(i < lines.length && /^\s*[-*]\s+/.test(lines[i])){ ul.push(lines[i].replace(/^\s*[-*]\s+/,"")); i++; }
      html += "<ul>" + ul.map(function(x){ return "<li>"+inline(x)+"</li>"; }).join("") + "</ul>";
      continue;
    }
    if(/^\s*\d+[.、)]\s+/.test(line)){
      var ol = [];
      while(i < lines.length && /^\s*\d+[.、)]\s+/.test(lines[i])){ ol.push(lines[i].replace(/^\s*\d+[.、)]\s+/,"")); i++; }
      html += "<ol>" + ol.map(function(x){ return "<li>"+inline(x)+"</li>"; }).join("") + "</ol>";
      continue;
    }
    if(line.trim().charAt(0) === ">"){
      var q = [];
      while(i < lines.length && lines[i].trim().charAt(0) === ">"){ q.push(lines[i].trim().replace(/^>\s?/,"")); i++; }
      html += "<blockquote>" + md(q.join("\n")) + "</blockquote>";
      continue;
    }
    var para = [line]; i++;
    while(i < lines.length && lines[i].trim() !== "" &&
      lines[i].trim().charAt(0) !== "|" &&
      !/^\s*[-*]\s+/.test(lines[i]) &&
      !/^\s*\d+[.、)]\s+/.test(lines[i]) &&
      !/^---+$/.test(lines[i].trim())){
      para.push(lines[i]); i++;
    }
    html += "<p>" + para.map(inline).join("<br>") + "</p>";
  }
  return html;
}

function bubble(role, text){
  var cls = (role === "USER") ? "user" : "ai";
  var face = (role === "USER") ? "你" : "AI";
  return '<div class="msg ' + cls + '"><div class="avatar">' + face + '</div><div class="bubble">' + md(text) + '</div></div>';
}

function render(){
  var chips = '<button class="chip' + (curSubject==="all" && !curEntry ? " on" : "") + '" onclick="setAll()">全部</button>';
  DATA.subjects.forEach(function(s){
    chips += '<button class="chip' + (curSubject===s.name && !curEntry ? " on" : "") + '" onclick="setSubject(\'' + s.name + '\')">' + esc(s.name) + '</button>';
  });
  DATA.subjects.forEach(function(s){
    s.entries.forEach(function(e){
      chips += '<button class="chip' + (curEntry===e.key ? " on" : "") + '" onclick="setEntry(\'' + e.key + '\')">' + esc(e.label) + '</button>';
    });
  });
  document.getElementById("subjectChips").innerHTML = chips;

  var kw = (document.getElementById("search").value || "").trim().toLowerCase();
  var html = "";
  DATA.subjects.forEach(function(s){
    if(curSubject !== "all" && curSubject !== s.name) return;
    var eh = "";
    s.entries.forEach(function(e){
      if(curEntry && curEntry !== e.key) return;
      var cards = "";
      e.cards.forEach(function(c){
        var text = (c.q + " " + c.a.join(" ")).toLowerCase();
        if(kw && text.indexOf(kw) < 0) return;
        var body = bubble("USER", c.q);
        c.a.forEach(function(a){ body += bubble("AI", a); });
        cards += '<details><summary><span class="q">' + inline(c.q) + '</span><span class="arrow">▶</span></summary><div class="body">' + body + '</div></details>';
      });
      if(!cards) return;
      eh += '<div class="entry"><div class="word">' + esc(e.label) + ' <span class="cnt">' + e.cards.length + ' 条讲解</span></div>' + cards + '</div>';
    });
    if(!eh) return;
    html += '<div class="subject"><h2>' + esc(s.name) + '</h2><div class="meta">共 ' + s.entries.length + ' 个词条</div>' + eh + '</div>';
  });
  document.getElementById("content").innerHTML = html || "";
  document.getElementById("empty").style.display = (!html && kw) ? "block" : "none";
}
function setAll(){ curSubject = "all"; curEntry = null; render(); }
function setSubject(n){ curSubject = n; curEntry = null; render(); }
function setEntry(k){ curEntry = (curEntry === k) ? null : k; render(); }
function applyFilter(){ curEntry = null; render(); }
render();
</script>
