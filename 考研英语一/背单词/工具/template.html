<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<title>考研背单词 · 艾宾浩斯</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --ink:#1f2430; --sub:#7a8194;
    --brand:#4f6ef7; --brand-ink:#ffffff; --line:#e8eaf0;
    --ok:#2f9e6f; --no:#e05a5a; --warn:#d99a2b;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.55; padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:20; background:linear-gradient(135deg,#4f6ef7,#6a5af7);
    color:#fff; padding:14px 16px 12px;
    box-shadow:0 2px 12px rgba(79,110,247,.25);
  }
  header h1{margin:0; font-size:18px; font-weight:700}
  header .stats{display:flex; gap:14px; margin-top:10px; font-size:12.5px; flex-wrap:wrap}
  header .stats span{background:rgba(255,255,255,.16); padding:4px 10px; border-radius:999px}
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; background:var(--card); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; padding:12px 4px; font-size:13px; color:var(--sub);
    cursor:pointer; display:flex; flex-direction:column; gap:2px; align-items:center;
  }
  nav button.on{color:var(--brand); font-weight:700}
  nav button .ico{font-size:18px; line-height:1}
  main{padding:16px; max-width:720px; margin:0 auto}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(20,24,40,.04)}
  .muted{color:var(--sub); font-size:13px}
  .row{display:flex; align-items:center; gap:10px; justify-content:space-between}
  .btn{border:none; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:600; cursor:pointer}
  .btn-block{width:100%}
  .btn-ok{background:var(--ok); color:#fff}
  .btn-no{background:var(--no); color:#fff}
  .btn-ghost{background:#eef1fb; color:var(--brand)}
  .btn-brand{background:var(--brand); color:#fff}
  .bigword{font-size:34px; font-weight:800; letter-spacing:.5px; text-align:center; margin:6px 0 2px}
  .phon{text-align:center; color:var(--sub); font-size:14px; margin:0 0 14px}
  .meaning{font-size:19px; text-align:center; margin:10px 0 18px; min-height:30px; padding:14px 10px; border-radius:12px; background:#f7f8fd}
  .meaning.hidden{color:transparent; background:#f7f8fd; text-shadow:none}
  .meaning.hidden::after{content:"点击显示释义"; color:var(--sub); font-size:14px}
  .actions{display:flex; gap:12px; margin-top:6px}
  .actions .btn{flex:1}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; background:#eef1fb; color:var(--brand)}
  .tag.ok{background:#e6f5ee; color:var(--ok)}
  .tag.no{background:#fdeaea; color:var(--no)}
  .tag.warn{background:#fbf1df; color:var(--warn)}
  ul.list{list-style:none; margin:0; padding:0}
  ul.list li{padding:10px 2px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px}
  ul.list li:last-child{border-bottom:none}
  .w{font-weight:700; font-size:16px}
  .t{color:var(--sub); font-size:13.5px}
  input[type=number],input[type=text],select,textarea{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; background:#fff; color:var(--ink);
  }
  .seg{display:flex; background:#eef1fb; border-radius:12px; padding:4px; gap:4px}
  .seg button{flex:1; border:none; background:none; padding:8px; border-radius:9px; font-size:13px; color:var(--sub); cursor:pointer}
  .seg button.on{background:#fff; color:var(--brand); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .read{border-radius:12px; border:1px solid var(--line); padding:14px; background:#fff; margin-top:10px}
  .read p{white-space:pre-wrap; margin:0 0 12px; font-size:15px}
  .read mark{background:#ffe9a8; border-radius:3px; padding:0 2px; color:inherit}
  .hint{font-size:12.5px; color:var(--sub)}
  .center{text-align:center}
  .progress{height:8px; background:#eef1fb; border-radius:999px; overflow:hidden; margin:10px 0}
  .progress i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),#6a5af7); border-radius:999px; transition:width .25s}
</style>
</head>
<body>
<header>
  <h1>考研背单词 · 艾宾浩斯</h1>
  <div class="stats">
    <span id="stNew">新词 0</span>
    <span id="stDue">待复习 0</span>
    <span id="stDone">已掌握 0</span>
  </div>
</header>

<main>
  <section id="view-learn">
    <div class="card" id="learnCard" style="display:none">
      <div class="row"><span class="tag" id="learnTag">新词</span><span class="hint" id="learnPos">1 / 1</span></div>
      <div class="bigword" id="learnWord"></div>
      <div class="meaning hidden" id="learnMeaning"></div>
      <div class="actions">
        <button class="btn btn-no" id="btnNo">忘了</button>
        <button class="btn btn-ghost" id="btnShow">显示释义</button>
        <button class="btn btn-ok" id="btnOk">认识</button>
      </div>
    </div>
    <div class="card center" id="learnEmpty">
      <div style="font-size:40px">🎉</div>
      <p class="muted" id="learnEmptyText">今天没有要复习的单词</p>
    </div>
  </section>

  <section id="view-list" style="display:none">
    <div class="card">
      <input type="text" id="search" placeholder="搜索单词或释义…" oninput="renderList()">
      <div class="progress" style="margin-top:12px"><i id="listBar" style="width:0"></i></div>
      <p class="hint" id="listStat"></p>
    </div>
    <div class="card"><ul class="list" id="wordList"></ul></div>
  </section>

  <section id="view-read" style="display:none">
    <div class="card">
      <div class="seg" id="readSel"></div>
      <div class="seg" style="margin-top:10px" id="langSel">
        <button data-lang="en" class="on">英文</button>
        <button data-lang="cn">中文</button>
        <button data-lang="both">双语</button>
      </div>
    </div>
    <div class="card read" id="readBody"></div>
  </section>

  <section id="view-data" style="display:none">
    <div class="card">
      <label class="hint" for="dailyNew">每天新词数量</label>
      <input type="number" id="dailyNew" min="1" max="200" value="8" onchange="saveSetting()">
      <p class="hint" style="margin-top:10px">艾宾浩斯复习间隔：1 / 2 / 4 / 7 / 15 天</p>
    </div>
    <div class="card">
      <button class="btn btn-brand btn-block" onclick="exportData()">导出进度（JSON）</button>
      <p class="hint" style="margin:10px 0 0">在另一台设备上「导入进度」即可同步。</p>
      <label class="btn btn-ghost btn-block" style="margin-top:12px;text-align:center;display:block">
        导入进度（JSON）
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </label>
    </div>
    <div class="card">
      <button class="btn btn-no btn-block" onclick="resetData()">清空全部学习进度</button>
    </div>
  </section>
</main>

<nav>
  <button data-tab="learn" class="on"><span class="ico">📖</span>学习</button>
  <button data-tab="list"><span class="ico">📚</span>词表</button>
  <button data-tab="read"><span class="ico">📄</span>阅读</button>
  <button data-tab="data"><span class="ico">⚙️</span>数据</button>
</nav>

<script>
const DATA = __DATA__;
const WORDS = DATA.words.map(function(x){ return {w:x[0], t:x[1]}; });
const READINGS = DATA.readings;
const INTERVALS = [1,2,4,7,15];
const KEY = "kaoyan_vocab_state_v1";

let state = loadState();
let queue = [];
let qi = 0;
let meaningShown = false;

function loadState(){
  try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ return {}; }
}
function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function getState(w){
  var s = state[w];
  if(!s){ s = {s:-1, next:null}; state[w]=s; }
  return s;
}
function todayStr(){
  var d = new Date();
  var local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
function addDays(str, n){
  var d = new Date(str + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function setting(key, def){
  try{
    var s = JSON.parse(localStorage.getItem("kaoyan_vocab_settings") || "{}");
    return (s[key] === undefined) ? def : s[key];
  }catch(e){ return def; }
}
function saveSetting(){
  var s = { dailyNew: Math.max(1, parseInt(document.getElementById("dailyNew").value) || 8) };
  localStorage.setItem("kaoyan_vocab_settings", JSON.stringify(s));
  buildQueue(); refreshStats(); renderList();
}

function dueReviews(){
  var today = todayStr();
  return WORDS.filter(function(x){
    var s = getState(x.w);
    return s.s >= 0 && s.s < 5 && s.next && s.next <= today;
  });
}
function newWords(){
  return WORDS.filter(function(x){
    var s = getState(x.w);
    return s.s < 0;
  });
}

function buildQueue(){
  var daily = setting("dailyNew", 8);
  var nw = newWords().slice(0, daily);
  var due = dueReviews();
  queue = [];
  nw.forEach(function(x){ queue.push({word:x, kind:"new"}); });
  due.forEach(function(x){ queue.push({word:x, kind:"review"}); });
  qi = 0;
}

function refreshStats(){
  var done = WORDS.filter(function(x){ return getState(x.w).s >= 5; }).length;
  document.getElementById("stNew").textContent = "新词 " + newWords().length;
  document.getElementById("stDue").textContent = "待复习 " + dueReviews().length;
  document.getElementById("stDone").textContent = "已掌握 " + done;
}

function showCard(){
  var box = document.getElementById("learnCard");
  var empty = document.getElementById("learnEmpty");
  if(!queue.length || qi >= queue.length){
    box.style.display = "none";
    empty.style.display = "block";
    document.getElementById("learnEmptyText").textContent =
      (newWords().length > 0) ? "今日新词已学完，明天再来～" : "今天没有要复习的单词，休息一下";
    return;
  }
  box.style.display = "block";
  empty.style.display = "none";
  var item = queue[qi];
  document.getElementById("learnTag").textContent = (item.kind === "new") ? "新词" : "复习";
  document.getElementById("learnTag").className = "tag" + ((item.kind==="new")?"":" warn");
  document.getElementById("learnPos").textContent = (qi+1) + " / " + queue.length;
  document.getElementById("learnWord").textContent = item.word.w;
  meaningShown = false;
  document.getElementById("learnMeaning").textContent = item.word.t;
  document.getElementById("learnMeaning").className = "meaning hidden";
  document.getElementById("btnShow").textContent = "显示释义";
}

function answer(ok){
  if(!queue.length || qi >= queue.length) return;
  var item = queue[qi];
  var s = getState(item.word.w);
  var today = todayStr();
  if(ok){
    var base = (s.s < 0) ? 0 : s.s;
    var interval = INTERVALS[Math.min(base, INTERVALS.length-1)];
    s.s = base + 1;
    if(s.s >= 5){ s.s = 5; s.next = null; }
    else { s.next = addDays(today, interval); }
  } else {
    s.s = 0;
    s.next = today;
    // move to end to avoid immediate loop
    queue.push(queue.splice(qi,1)[0]);
    saveState(); showCard(); return;
  }
  saveState();
  qi++;
  showCard();
  refreshStats();
}

function renderList(){
  var q = (document.getElementById("search").value || "").trim().toLowerCase();
  var html = "";
  var done = 0, learning = 0, fresh = 0;
  WORDS.forEach(function(x){
    var s = getState(x.w);
    var w = x.w.toLowerCase();
    if(q && w.indexOf(q) < 0 && x.t.toLowerCase().indexOf(q) < 0) return;
    var badge, cls;
    if(s.s >= 5){ badge="已掌握"; cls="ok"; done++; }
    else if(s.s < 0){ badge="新词"; cls=""; fresh++; }
    else { badge="复习中"; cls="warn"; learning++; }
    html += '<li><div><div class="w">'+esc(x.w)+'</div><div class="t">'+esc(x.t)+'</div></div><span class="tag '+cls+'">'+badge+'</span></li>';
  });
  document.getElementById("wordList").innerHTML = html || '<li class="muted">没有匹配的单词</li>';
  var total = done + learning + fresh;
  var pct = total ? Math.round((done + learning) / WORDS.length * 100) : 0;
  document.getElementById("listBar").style.width = pct + "%";
  document.getElementById("listStat").textContent = "已掌握 " + done + " · 复习中 " + learning + " · 新词 " + fresh + " · 共 " + WORDS.length;
}

function buildReadSel(){
  var box = document.getElementById("readSel");
  box.innerHTML = "";
  READINGS.forEach(function(r, i){
    var b = document.createElement("button");
    b.textContent = r.day;
    b.className = (i===0) ? "on" : "";
    b.onclick = function(){ setRead(i); };
    box.appendChild(b);
  });
}
var curRead = 0, curLang = "en";
function setRead(i){ curRead = i; renderRead(); }
function renderRead(){
  var r = READINGS[curRead];
  var body = document.getElementById("readBody");
  var en = '<p>'+highlight(r.en)+'</p>';
  var cn = '<p>'+esc(r.cn)+'</p>';
  if(curLang === "en") body.innerHTML = en;
  else if(curLang === "cn") body.innerHTML = cn;
  else body.innerHTML = en + cn;
  var btns = document.querySelectorAll("#readSel button");
  btns.forEach(function(b,i){ b.className = (i===curRead) ? "on" : ""; });
}
function highlight(text){
  var out = esc(text);
  var ws = WORDS.map(function(x){return x.w;}).sort(function(a,b){return b.length-a.length;});
  ws.forEach(function(w){
    var re = new RegExp("\\b(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(s|es|ed|ing|ly)?\\b", "gi");
    out = out.replace(re, "<mark>$1$2</mark>");
  });
  return out;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function exportData(){
  var payload = { state: state, settings: JSON.parse(localStorage.getItem("kaoyan_vocab_settings") || "{}") };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "背单词进度-" + todayStr() + ".json";
  a.click();
}
function importData(ev){
  var f = ev.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var p = JSON.parse(r.result);
      if(p.state) state = p.state;
      if(p.settings) localStorage.setItem("kaoyan_vocab_settings", JSON.stringify(p.settings));
      saveState(); buildQueue(); refreshStats(); renderList(); showCard();
      alert("导入成功");
    }catch(e){ alert("导入失败：文件格式不正确"); }
  };
  r.readAsText(f);
}
function resetData(){
  if(!confirm("确定清空全部学习进度吗？此操作不可撤销。")) return;
  state = {}; saveState(); buildQueue(); refreshStats(); renderList(); showCard();
}

function switchTab(name){
  ["learn","list","read","data"].forEach(function(t){
    document.getElementById("view-"+t).style.display = (t===name) ? "block" : "none";
  });
  document.querySelectorAll("nav button").forEach(function(b){
    b.className = (b.dataset.tab === name) ? "on" : "";
  });
}

document.querySelectorAll("nav button").forEach(function(b){
  b.onclick = function(){ switchTab(b.dataset.tab); };
});
document.getElementById("btnOk").onclick = function(){ answer(true); };
document.getElementById("btnNo").onclick = function(){ answer(false); };
document.getElementById("btnShow").onclick = function(){
  var m = document.getElementById("learnMeaning");
  meaningShown = !meaningShown;
  m.className = meaningShown ? "meaning" : "meaning hidden";
  document.getElementById("btnShow").textContent = meaningShown ? "隐藏释义" : "显示释义";
};
document.getElementById("learnMeaning").onclick = function(){
  this.className = "meaning";
  meaningShown = true;
  document.getElementById("btnShow").textContent = "隐藏释义";
};
document.querySelectorAll("#langSel button").forEach(function(b){
  b.onclick = function(){
    curLang = b.dataset.lang;
    document.querySelectorAll("#langSel button").forEach(function(x){ x.className = (x===b) ? "on" : ""; });
    renderRead();
  };
});

document.getElementById("dailyNew").value = setting("dailyNew", 8);
buildReadSel();
buildQueue();
refreshStats();
renderList();
renderRead();
showCard();
</script>
</body>
</html>
