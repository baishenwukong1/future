<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>考研背单词 · 艾宾浩斯</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --ink:#1f2430; --sub:#7a8194;
    --brand:#4f6ef7; --brand-ink:#ffffff; --line:#e8eaf0;
    --ok:#2f9e6f; --no:#e05a5a; --warn:#d99a2b;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.55; padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:20; background:linear-gradient(135deg,#4f6ef7,#6a5af7);
    color:#fff; padding:14px 16px 12px;
    box-shadow:0 2px 12px rgba(79,110,247,.25);
  }
  header h1{margin:0; font-size:18px; font-weight:700}
  header .stats{display:flex; gap:14px; margin-top:10px; font-size:12.5px; flex-wrap:wrap}
  header .stats span{background:rgba(255,255,255,.16); padding:4px 10px; border-radius:999px}
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; background:var(--card); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; padding:12px 4px; font-size:13px; color:var(--sub);
    cursor:pointer; display:flex; flex-direction:column; gap:2px; align-items:center;
  }
  nav button.on{color:var(--brand); font-weight:700}
  nav button .ico{font-size:18px; line-height:1}
  main{padding:16px; max-width:720px; margin:0 auto}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(20,24,40,.04)}
  .muted{color:var(--sub); font-size:13px}
  .row{display:flex; align-items:center; gap:10px; justify-content:space-between}
  .btn{border:none; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:600; cursor:pointer}
  .btn-block{width:100%}
  .btn-ok{background:var(--ok); color:#fff}
  .btn-no{background:var(--no); color:#fff}
  .btn-ghost{background:#eef1fb; color:var(--brand)}
  .btn-brand{background:var(--brand); color:#fff}
  .bigword{font-size:34px; font-weight:800; letter-spacing:.5px; text-align:center; margin:6px 0 2px}
  .phon{text-align:center; color:var(--sub); font-size:14px; margin:0 0 14px}
  .meaning{font-size:19px; text-align:center; margin:10px 0 18px; min-height:30px; padding:14px 10px; border-radius:12px; background:#f7f8fd}
  .meaning.hidden{color:transparent; background:#f7f8fd; text-shadow:none}
  .meaning.hidden::after{content:"点击显示释义"; color:var(--sub); font-size:14px}
  .actions{display:flex; gap:12px; margin-top:6px}
  .actions .btn{flex:1}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; background:#eef1fb; color:var(--brand)}
  .tag.ok{background:#e6f5ee; color:var(--ok)}
  .tag.no{background:#fdeaea; color:var(--no)}
  .tag.warn{background:#fbf1df; color:var(--warn)}
  ul.list{list-style:none; margin:0; padding:0}
  ul.list li{padding:10px 2px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px}
  ul.list li:last-child{border-bottom:none}
  .w{font-weight:700; font-size:16px}
  .t{color:var(--sub); font-size:13.5px}
  input[type=number],input[type=text],select,textarea{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; background:#fff; color:var(--ink);
  }
  .seg{display:flex; background:#eef1fb; border-radius:12px; padding:4px; gap:4px}
  .seg button{flex:1; border:none; background:none; padding:8px; border-radius:9px; font-size:13px; color:var(--sub); cursor:pointer}
  .seg button.on{background:#fff; color:var(--brand); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .read{border-radius:12px; border:1px solid var(--line); padding:14px; background:#fff; margin-top:10px}
  .read p{white-space:pre-wrap; margin:0 0 12px; font-size:15px}
  .read mark{background:#ffe9a8; border-radius:3px; padding:0 2px; color:inherit}
  .hint{font-size:12.5px; color:var(--sub)}
  .center{text-align:center}
  .progress{height:8px; background:#eef1fb; border-radius:999px; overflow:hidden; margin:10px 0}
  .progress i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),#6a5af7); border-radius:999px; transition:width .25s}
</style>
</head>
<body>
<header>
  <h1>考研背单词 · 艾宾浩斯</h1>
  <div class="stats">
    <span id="stNew">新词 0</span>
    <span id="stDue">待复习 0</span>
    <span id="stDone">已掌握 0</span>
  </div>
</header>

<main>
  <section id="view-learn">
    <div class="card" id="learnCard" style="display:none">
      <div class="row"><span class="tag" id="learnTag">新词</span><span class="hint" id="learnPos">1 / 1</span></div>
      <div class="bigword" id="learnWord"></div>
      <div class="meaning hidden" id="learnMeaning"></div>
      <div class="actions">
        <button class="btn btn-no" id="btnNo">忘了</button>
        <button class="btn btn-ghost" id="btnShow">显示释义</button>
        <button class="btn btn-ok" id="btnOk">认识</button>
      </div>
    </div>
    <div class="card center" id="learnEmpty">
      <div style="font-size:40px">🎉</div>
      <p class="muted" id="learnEmptyText">今天没有要复习的单词</p>
    </div>
  </section>

  <section id="view-list" style="display:none">
    <div class="card">
      <input type="text" id="search" placeholder="搜索单词或释义…" oninput="renderList()">
      <div class="progress" style="margin-top:12px"><i id="listBar" style="width:0"></i></div>
      <p class="hint" id="listStat"></p>
    </div>
    <div class="card"><ul class="list" id="wordList"></ul></div>
  </section>

  <section id="view-read" style="display:none">
    <div class="card">
      <div class="seg" id="readSel"></div>
      <div class="seg" style="margin-top:10px" id="langSel">
        <button data-lang="en" class="on">英文</button>
        <button data-lang="cn">中文</button>
        <button data-lang="both">双语</button>
      </div>
    </div>
    <div class="card read" id="readBody"></div>
  </section>

  <section id="view-data" style="display:none">
    <div class="card">
      <label class="hint" for="dailyNew">每天新词数量</label>
      <input type="number" id="dailyNew" min="1" max="200" value="8" onchange="saveSetting()">
      <p class="hint" style="margin-top:10px">艾宾浩斯复习间隔：1 / 2 / 4 / 7 / 15 天</p>
    </div>
    <div class="card">
      <button class="btn btn-brand btn-block" onclick="exportData()">导出进度（JSON）</button>
      <p class="hint" style="margin:10px 0 0">在另一台设备上「导入进度」即可同步。</p>
      <label class="btn btn-ghost btn-block" style="margin-top:12px;text-align:center;display:block">
        导入进度（JSON）
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </label>
    </div>
    <div class="card">
      <button class="btn btn-no btn-block" onclick="resetData()">清空全部学习进度</button>
    </div>
  </section>
</main>

<nav>
  <button data-tab="learn" class="on"><span class="ico">📖</span>学习</button>
  <button data-tab="list"><span class="ico">📚</span>词表</button>
  <button data-tab="read"><span class="ico">📄</span>阅读</button>
  <button data-tab="data"><span class="ico">⚙️</span>数据</button>
</nav>

<script>
const DATA = {"words": [["popularize", "v. 使流行，通俗化"], ["paternity", "n. 父亲身份"], ["superfluous", "adj. 多余的"], ["altruistic", "adj. 利他的"], ["sustainably", "adv. 可持续地，持久地"], ["existential", "adj. 生存意义的，存在主义的"], ["submission", "n. 服从，提交，陈述"], ["paternal", "adj. 父亲的，父系的"], ["allocate", "v. 分配"], ["flaw", "n. 缺陷，缺点，瑕疵"], ["sustainability", "n. 可持续性，持久性"], ["genetically", "adv. 从基因上"], ["attribute", "v. 归因于，把…归于 n. 属性"], ["overlook", "v. 忽略，忽视，俯瞰"], ["distribution", "n. 分布，分发，配送"], ["designate", "v. 正式命名，任命，标记"], ["neglect", "v. 忽视，疏忽，遗忘 n. 疏忽"], ["lineage", "n. 血统"], ["redistribution", "n. 再分配"], ["allocation", "n. 分配额度，分配"], ["ignorant", "adj. 无知的，不了解的，粗鲁的"], ["superb", "adj. 极好的"], ["sustain", "v. 维持，保持，遭受，支持"], ["gene", "n. 基因"], ["prioritize", "v. 优先处理，优先考虑"], ["genetic", "adj. 遗传的"], ["devote", "v. 投入，献给"], ["dedicate", "v. 致力于，题献，奉献"], ["maintenance", "n. 维修，维持，生活费"], ["sustainable", "adj. 可持续的"], ["genome", "n. 基因组"], ["popularity", "n. 人气，流行"], ["genetics", "n. 遗传学"], ["supreme", "adj. 最高级别的，极度的"], ["stickiness", "n. 粘性，黏腻感，用户粘性"], ["academically", "adv. 学术上，理论上"], ["esteem", "n. 敬重，尊重 v. 尊敬，看待"], ["scholarly", "adj. 博学的，学术的"], ["dignity", "n. 尊严"], ["forge", "v. 努力建立，伪造，锻造"], ["respectable", "adj. 体面的，值得骄傲的"], ["prevailing", "adj. 最普遍的，盛行的"], ["disadvantage", "n. 不利条件 v. 使处于不利地位"], ["academic", "adj. 学术的，理论性的 n. 学者"], ["conjunction", "n. 连词，联合，结合"], ["cling", "vi. 紧紧抓住，粘附，依赖"], ["asset", "n. 资产"], ["disrespect", "n. 不尊重 v. 不尊重"], ["adhere", "v. 粘附，坚持，遵循"], ["intellect", "n. 智力，智者"], ["realistic", "adj. 务实的，切实可行的，逼真的"], ["prevalent", "adj. 普遍的，盛行的"], ["attachment", "n. 附件，连接，依恋，信奉"], ["hygiene", "n. 卫生"], ["manufacture", "v. 批量生产，捏造，生成 n. 制造"], ["functional", "adj. 实用的，功能型的，可用的"], ["academy", "n. 专科学校，学会，研究院"], ["scholar", "n. 学者，奖学金获得者"], ["intellectual", "adj. 智力的，聪明的 n. 知识分子"], ["decent", "adj. 尚可的，正派的，得体的"], ["pandemic", "n. 大流行病 adj. 全国性的"], ["mock", "v. 嘲笑，蔑视 adj. 虚假的，模拟的"], ["manufacturer", "n. 制造商"], ["manufacturing", "n. 制造"]], "readings": [{"day": "DAY01", "en": "The Hidden Legacy of Human Progress\nIn modern society, the growing popularity of science has helped popularize many ideas that were once limited to academic circles. Among these ideas, the study of genetics, the genome, and the role of each gene in human development has attracted widespread attention. Scientists have made remarkable progress in understanding how certain characteristics can be attributed to specific genetic factors, while also recognizing that environmental influences should not be overlooked.\nFor a long time, discussions about intelligence, behavior, and even social success were largely shaped by assumptions about family background and lineage. Some researchers emphasized paternal influence, while others focused on paternity and inheritance. However, modern studies suggest that human development is far more complex than earlier theories assumed. A major flaw in many traditional arguments was their tendency to ignore the interaction between genes and the environment.\nThe debate has important social implications. If success is viewed as being primarily determined by genetic advantages, society may become more willing to accept unequal wealth distribution and limited opportunities for social mobility. On the other hand, if governments choose to allocate educational resources more fairly, they may encourage a more equitable redistribution of opportunities. Such decisions require policymakers to carefully consider how resources should be distributed and which groups should be designated for additional support. Effective resource allocation therefore remains a central challenge for modern societies.\nAt the same time, many social scientists argue that human beings possess an altruistic tendency that encourages cooperation. People often devote their time and energy to helping others, and some even dedicate their entire lives to public service. These actions cannot be fully explained by genetic inheritance alone. Instead, cultural values, education, and social institutions all contribute to shaping individual behavior.\nThe question becomes even more significant when viewed from an existential perspective. Human beings constantly seek meaning and purpose. A society that focuses exclusively on economic growth may neglect important aspects of human well-being. Material wealth, although important, can become superfluous if it fails to improve people's quality of life. Consequently, many experts now argue that governments should prioritize long-term sustainability rather than short-term economic gains.\nThe concept of living sustainably has become increasingly important in recent decades. To sustain economic development while protecting natural resources, nations must invest in environmental protection, technological innovation, and infrastructure maintenance. Only through sustainable policies can future generations enjoy the same opportunities available today. Achieving this goal may seem difficult, but history suggests that societies capable of adapting to new challenges often achieve superb results and leave a supreme legacy for those who follow.", "cn": "人类进步的隐秘遗产\n在现代社会中，科学日益受到欢迎，使许多曾经局限于学术圈的思想得以普及。其中，遗传学、基因组以及基因在人类发展中的作用尤其受到广泛关注。\n科学家们在理解某些特征如何归因于特定遗传因素方面取得了显著进展，同时也认识到环境因素不应被忽视。\n长期以来，人们对于智力、行为乃至社会成功的讨论，往往受到家庭背景和血统的影响。一些研究者强调父系影响，另一些则关注亲子关系和遗传继承。然而现代研究表明，人类发展远比过去的理论复杂。许多传统观点的一个重大缺陷在于忽视了基因与环境之间的相互作用。\n这一争论具有重要的社会意义。如果成功被认为主要由遗传优势决定，那么社会可能更容易接受财富分配不均和社会流动机会受限。相反，如果政府更加公平地分配教育资源，就可能促进机会的重新分配。因此，资源配置仍然是现代社会面临的重要挑战。\n与此同时，许多社会学家认为，人类具有利他倾向，这种倾向促使人们合作。很多人投入时间和精力帮助他人，甚至将一生奉献给公共事业。这些行为并不能完全用遗传来解释。\n从存在主义角度来看，这一问题更加重要。人类不断追寻生命的意义和价值。如果一个社会只关注经济增长，就可能忽视幸福感的重要组成部分。如果财富无法改善生活质量，它甚至会变得多余。因此，越来越多的专家主张优先考虑可持续发展。\n近年来，可持续生活理念变得越来越重要。为了维持经济发展并保护自然资源，各国必须投资于环境保护、技术创新以及基础设施维护。只有通过可持续政策，未来世代才能享有与今天相同的机会。虽然这一目标并不容易实现，但历史表明，那些能够适应挑战的社会往往能够取得卓越成就，并为后人留下伟大的遗产。"}, {"day": "DAY02", "en": "The Unexpected Value of Human Connection in the Digital Age\nIn recent years, many educators have become concerned about a prevailing trend among young people: despite being more connected than ever through technology, they often struggle to form deep and meaningful relationships. This phenomenon has attracted considerable attention from both the academic community and the broader public.\nMany scholarly studies suggest that social media platforms are designed to increase user stickiness, encouraging individuals to spend more time online. While these platforms provide convenient ways to communicate, they may also strengthen unhealthy forms of emotional attachment. Some users gradually cling to virtual approval and begin to adhere to social expectations created by online communities rather than developing independent judgment.\nThis issue became even more prevalent during the COVID-19 pandemic. Schools, workplaces, and even social gatherings moved online. Although this shift allowed society to continue functioning, many students found themselves at a significant disadvantage. Learning academically requires not only access to information but also interaction, discussion, and critical thinking. Without regular face-to-face communication, some students experienced declining motivation and reduced self-esteem.\nResearchers from several prestigious academies have argued that education serves a purpose beyond the transmission of knowledge. A true scholar is not simply someone who memorizes facts but someone who develops both intellectual abilities and moral character. Historically, universities sought to forge individuals capable of independent thought and responsible action. Such goals remain relevant today.\nAnother challenge arises from the growing tendency to mock those who express unpopular opinions online. Public criticism can spread rapidly, causing individuals to feel a loss of dignity and self-confidence. In some cases, fear of disrespect discourages people from participating in public discussions. As a result, many choose silence over honest dialogue.\nFrom a realistic perspective, technology itself is neither good nor bad. It is merely a tool—a valuable asset whose impact depends on how it is used. Just as a manufacturer can produce either beneficial or harmful products through the process of manufacturing, digital platforms can contribute either to human development or to social division.\nTherefore, society should not view technology and human connection as being in conjunction with each other in a competitive sense. Instead, they should complement one another. A truly functional educational system should teach students not only how to acquire knowledge but also how to build respectable relationships based on trust, empathy, and mutual understanding. Only then can people fully develop their intellect while maintaining the social bonds that give life meaning.", "cn": "数字时代中人际联系的意外价值\n近年来，许多教育工作者开始担心年轻人中一种**盛行的（prevailing）趋势：尽管他们通过技术比以往任何时候都更加紧密地联系在一起，却常常难以建立深刻而有意义的人际关系。这一现象引起了学术界的（academic）**以及社会公众的广泛关注。\n许多学术性的（scholarly）研究表明，社交媒体平台被设计成提高用户黏性（stickiness），鼓励人们花费更多时间在线。虽然这些平台提供了便捷的沟通方式，但也可能强化不健康的情感依恋（attachment）。一些用户逐渐**依赖于（cling to）虚拟认可，并开始遵循（adhere to）**网络社区形成的社会期待，而不是培养独立判断能力。\n这一问题在新冠疫情（pandemic）期间变得更加普遍的（prevalent）。学校、工作场所乃至社交活动都转移到了线上。虽然这种转变使社会得以继续运转，但许多学生发现自己处于明显的劣势（disadvantage）。从**学业上地（academically）进行学习不仅需要获取信息，还需要互动、讨论和批判性思维。缺乏面对面交流使一些学生的学习动力下降，自我尊重、自尊（esteem）**受到影响。\n来自多所知名**学术机构（academy）的研究人员指出，教育的意义不仅在于知识传授。真正的学者（scholar）不仅仅是记忆事实的人，更是培养了智力的（intellectual）能力和道德品格的人。历史上，大学致力于塑造（forge）**能够独立思考并承担责任的人才。这一目标在今天依然重要。\n另一个挑战来自网络上越来越多人倾向于**嘲笑（mock）持不同意见的人。公开批评可能迅速传播，使个人感到尊严（dignity）受损和信心下降。在某些情况下，对被不尊重（disrespect）**的担忧甚至会阻碍人们参与公共讨论。因此，许多人选择沉默而非坦诚交流。\n从现实的（realistic）角度来看，技术本身并无善恶。它只是一种工具——一种宝贵的资产（asset），其影响取决于人们如何使用它。正如一家**制造商（manufacturer）可以通过制造（manufacturing）**过程生产有益或有害的产品一样，数字平台也可能促进人类发展，或加剧社会分裂。\n因此，社会不应将技术与人际联系视为彼此竞争的结合关系（conjunction）。相反，它们应该相互补充。一个真正有效的（functional）教育体系不仅应教会学生获取知识的方法，还应教会他们建立受人尊敬的（respectable）、基于信任、同理心和相互理解的人际关系。只有这样，人们才能充分发展自己的智力（intellect），同时维持赋予生命意义的社会纽带。"}]};
const WORDS = DATA.words.map(function(x){ return {w:x[0], t:x[1]}; });
const READINGS = DATA.readings;
const INTERVALS = [1,2,4,7,15];
const KEY = "kaoyan_vocab_state_v1";

let state = loadState();
let queue = [];
let qi = 0;
let meaningShown = false;

function loadState(){
  try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ return {}; }
}
function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function getState(w){
  var s = state[w];
  if(!s){ s = {s:-1, next:null}; state[w]=s; }
  return s;
}
function todayStr(){
  var d = new Date();
  var local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
function addDays(str, n){
  var d = new Date(str + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function setting(key, def){
  try{
    var s = JSON.parse(localStorage.getItem("kaoyan_vocab_settings") || "{}");
    return (s[key] === undefined) ? def : s[key];
  }catch(e){ return def; }
}
function saveSetting(){
  var s = { dailyNew: Math.max(1, parseInt(document.getElementById("dailyNew").value) || 8) };
  localStorage.setItem("kaoyan_vocab_settings", JSON.stringify(s));
  buildQueue(); refreshStats(); renderList();
}

function dueReviews(){
  var today = todayStr();
  return WORDS.filter(function(x){
    var s = getState(x.w);
    return s.s >= 0 && s.s < 5 && s.next && s.next <= today;
  });
}
function newWords(){
  return WORDS.filter(function(x){
    var s = getState(x.w);
    return s.s < 0;
  });
}

function buildQueue(){
  var daily = setting("dailyNew", 8);
  var nw = newWords().slice(0, daily);
  var due = dueReviews();
  queue = [];
  nw.forEach(function(x){ queue.push({word:x, kind:"new"}); });
  due.forEach(function(x){ queue.push({word:x, kind:"review"}); });
  qi = 0;
}

function refreshStats(){
  var done = WORDS.filter(function(x){ return getState(x.w).s >= 5; }).length;
  document.getElementById("stNew").textContent = "新词 " + newWords().length;
  document.getElementById("stDue").textContent = "待复习 " + dueReviews().length;
  document.getElementById("stDone").textContent = "已掌握 " + done;
}

function showCard(){
  var box = document.getElementById("learnCard");
  var empty = document.getElementById("learnEmpty");
  if(!queue.length || qi >= queue.length){
    box.style.display = "none";
    empty.style.display = "block";
    document.getElementById("learnEmptyText").textContent =
      (newWords().length > 0) ? "今日新词已学完，明天再来～" : "今天没有要复习的单词，休息一下";
    return;
  }
  box.style.display = "block";
  empty.style.display = "none";
  var item = queue[qi];
  document.getElementById("learnTag").textContent = (item.kind === "new") ? "新词" : "复习";
  document.getElementById("learnTag").className = "tag" + ((item.kind==="new")?"":" warn");
  document.getElementById("learnPos").textContent = (qi+1) + " / " + queue.length;
  document.getElementById("learnWord").textContent = item.word.w;
  meaningShown = false;
  document.getElementById("learnMeaning").textContent = item.word.t;
  document.getElementById("learnMeaning").className = "meaning hidden";
  document.getElementById("btnShow").textContent = "显示释义";
}

function answer(ok){
  if(!queue.length || qi >= queue.length) return;
  var item = queue[qi];
  var s = getState(item.word.w);
  var today = todayStr();
  if(ok){
    var base = (s.s < 0) ? 0 : s.s;
    var interval = INTERVALS[Math.min(base, INTERVALS.length-1)];
    s.s = base + 1;
    if(s.s >= 5){ s.s = 5; s.next = null; }
    else { s.next = addDays(today, interval); }
  } else {
    s.s = 0;
    s.next = today;
    // move to end to avoid immediate loop
    queue.push(queue.splice(qi,1)[0]);
    saveState(); showCard(); return;
  }
  saveState();
  qi++;
  showCard();
  refreshStats();
}

function renderList(){
  var q = (document.getElementById("search").value || "").trim().toLowerCase();
  var html = "";
  var done = 0, learning = 0, fresh = 0;
  WORDS.forEach(function(x){
    var s = getState(x.w);
    var w = x.w.toLowerCase();
    if(q && w.indexOf(q) < 0 && x.t.toLowerCase().indexOf(q) < 0) return;
    var badge, cls;
    if(s.s >= 5){ badge="已掌握"; cls="ok"; done++; }
    else if(s.s < 0){ badge="新词"; cls=""; fresh++; }
    else { badge="复习中"; cls="warn"; learning++; }
    html += '<li><div><div class="w">'+esc(x.w)+'</div><div class="t">'+esc(x.t)+'</div></div><span class="tag '+cls+'">'+badge+'</span></li>';
  });
  document.getElementById("wordList").innerHTML = html || '<li class="muted">没有匹配的单词</li>';
  var total = done + learning + fresh;
  var pct = total ? Math.round((done + learning) / WORDS.length * 100) : 0;
  document.getElementById("listBar").style.width = pct + "%";
  document.getElementById("listStat").textContent = "已掌握 " + done + " · 复习中 " + learning + " · 新词 " + fresh + " · 共 " + WORDS.length;
}

function buildReadSel(){
  var box = document.getElementById("readSel");
  box.innerHTML = "";
  READINGS.forEach(function(r, i){
    var b = document.createElement("button");
    b.textContent = r.day;
    b.className = (i===0) ? "on" : "";
    b.onclick = function(){ setRead(i); };
    box.appendChild(b);
  });
}
var curRead = 0, curLang = "en";
function setRead(i){ curRead = i; renderRead(); }
function renderRead(){
  var r = READINGS[curRead];
  var body = document.getElementById("readBody");
  var en = '<p>'+highlight(r.en)+'</p>';
  var cn = '<p>'+esc(r.cn)+'</p>';
  if(curLang === "en") body.innerHTML = en;
  else if(curLang === "cn") body.innerHTML = cn;
  else body.innerHTML = en + cn;
  var btns = document.querySelectorAll("#readSel button");
  btns.forEach(function(b,i){ b.className = (i===curRead) ? "on" : ""; });
}
function highlight(text){
  var out = esc(text);
  var ws = WORDS.map(function(x){return x.w;}).sort(function(a,b){return b.length-a.length;});
  ws.forEach(function(w){
    var re = new RegExp("\\b(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(s|es|ed|ing|ly)?\\b", "gi");
    out = out.replace(re, "<mark>$1$2</mark>");
  });
  return out;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function exportData(){
  var payload = { state: state, settings: JSON.parse(localStorage.getItem("kaoyan_vocab_settings") || "{}") };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "背单词进度-" + todayStr() + ".json";
  a.click();
}
function importData(ev){
  var f = ev.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var p = JSON.parse(r.result);
      if(p.state) state = p.state;
      if(p.settings) localStorage.setItem("kaoyan_vocab_settings", JSON.stringify(p.settings));
      saveState(); buildQueue(); refreshStats(); renderList(); showCard();
      alert("导入成功");
    }catch(e){ alert("导入失败：文件格式不正确"); }
  };
  r.readAsText(f);
}
function resetData(){
  if(!confirm("确定清空全部学习进度吗？此操作不可撤销。")) return;
  state = {}; saveState(); buildQueue(); refreshStats(); renderList(); showCard();
}

function switchTab(name){
  ["learn","list","read","data"].forEach(function(t){
    document.getElementById("view-"+t).style.display = (t===name) ? "block" : "none";
  });
  document.querySelectorAll("nav button").forEach(function(b){
    b.className = (b.dataset.tab === name) ? "on" : "";
  });
}

document.querySelectorAll("nav button").forEach(function(b){
  b.onclick = function(){ switchTab(b.dataset.tab); };
});
document.getElementById("btnOk").onclick = function(){ answer(true); };
document.getElementById("btnNo").onclick = function(){ answer(false); };
document.getElementById("btnShow").onclick = function(){
  var m = document.getElementById("learnMeaning");
  meaningShown = !meaningShown;
  m.className = meaningShown ? "meaning" : "meaning hidden";
  document.getElementById("btnShow").textContent = meaningShown ? "隐藏释义" : "显示释义";
};
document.getElementById("learnMeaning").onclick = function(){
  this.className = "meaning";
  meaningShown = true;
  document.getElementById("btnShow").textContent = "隐藏释义";
};
document.querySelectorAll("#langSel button").forEach(function(b){
  b.onclick = function(){
    curLang = b.dataset.lang;
    document.querySelectorAll("#langSel button").forEach(function(x){ x.className = (x===b) ? "on" : ""; });
    renderRead();
  };
});

document.getElementById("dailyNew").value = setting("dailyNew", 8);
buildReadSel();
buildQueue();
refreshStats();
renderList();
renderRead();
showCard();
</script>
</body>
</html>
