<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研统筹舱 · 向未来出发</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #141d30;
    --panel-2: #1b2740;
    --line: #263449;
    --text: #e6edf7;
    --muted: #8ea3bf;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --good: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1000px 500px at 85% -10%, rgba(99,102,241,.22), transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(34,211,238,.14), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .bg-video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; pointer-events: none;
  }
  .bg-overlay {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(8,12,24,.28) 0%, rgba(8,12,24,.40) 55%, rgba(8,12,24,.55) 100%);
    opacity: .5;
    transition: opacity .35s ease;
  }
  body:hover .bg-overlay {
    opacity: 1;
  }
  @media (hover: none) {
    .bg-overlay { opacity: 1; }
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 14px 20px 24px; }
  .wrap, .toast { position: relative; z-index: 2; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 11px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    box-shadow: 0 6px 18px rgba(99,102,241,.4);
  }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .top-actions { display: flex; gap: 8px; }

  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 9px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: .18s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), #4f46e5); border: none; box-shadow: 0 6px 16px rgba(99,102,241,.35); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .card {
    background: linear-gradient(180deg, rgba(24,34,58,.50), rgba(16,24,44,.40));
    border: 1px solid rgba(255,255,255,.13); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,.28); padding: 18px;
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
  }
  .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  /* 倒计时 */
  .countdown { text-align: center; padding: 14px 22px 12px; position: relative; overflow: hidden; }
  .countdown::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, rgba(99,102,241,.12), transparent 45%, rgba(34,211,238,.1));
    pointer-events: none;
  }
  .countdown .label { color: var(--muted); font-size: 13px; letter-spacing: 3px; }
  .countdown .big { font-size: clamp(38px, 6vw, 60px); font-weight: 800; line-height: 1.15;
    background: linear-gradient(120deg, #a5b4fc, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .countdown .big small { font-size: .4em; font-weight: 600; }
  .countdown .detail { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .countdown .quote { margin-top: 6px; font-size: 13px; color: var(--accent-2); opacity: .95; }
  .countdown .date-edit { margin-top: 6px; display: inline-flex; gap: 8px; align-items: center; }
  .countdown input[type=date] {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 7px 12px; border-radius: 9px; font-size: 13px; font-family: inherit;
  }

  /* 首页科目卡片 */
  .subject-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  @media (max-width: 980px) { .subject-strip { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .subject-strip { grid-template-columns: 1fr; } }
  .subject-card {
    position: relative; border-radius: var(--radius); padding: 14px; cursor: pointer; overflow: hidden;
    background: linear-gradient(180deg, rgba(24,34,58,.50), rgba(16,24,44,.40));
    border: 1px solid rgba(255,255,255,.13); box-shadow: 0 8px 24px rgba(0,0,0,.28);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    transition: .2s; display: flex; flex-direction: column; gap: 12px;
  }
  .subject-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--sc, var(--accent)); }
  .subject-card:hover { transform: translateY(-4px); border-color: var(--sc, var(--accent)); box-shadow: 0 16px 34px rgba(0,0,0,.45); }
  .subject-card .icon { font-size: 24px; }
  .subject-card .name { font-size: 15px; font-weight: 700; }
  .subject-card .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .subject-card .go { margin-top: auto; font-size: 12px; color: var(--sc, var(--accent)); display: flex; align-items: center; gap: 4px; }
  .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--sc, var(--accent)), var(--accent-2)); transition: width .4s; }

  /* 科目页 */
  .sub-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .sub-header .back { font-size: 15px; color: var(--muted); cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px; }
  .sub-header .back:hover { color: var(--text); }
  .sub-header h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .sub-header h2 span { width: 38px; height: 38px; border-radius: 11px; background: var(--sc, var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .tool-link {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 11px; font-size: 14px; transition: .18s;
  }
  .tool-link:hover { border-color: var(--sc, var(--accent)); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .tool-link .arr { color: var(--sc, var(--accent)); }
  .no-tools { color: var(--muted); font-size: 13px; background: rgba(255,255,255,.04); border: 1px dashed var(--line); border-radius: 11px; padding: 12px 16px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 780px) { .grid-2 { grid-template-columns: 1fr; } }

  /* 计时器 */
  .timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ring { position: relative; width: 200px; height: 200px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-bg { stroke: rgba(255,255,255,.08); }
  .ring .ring-fg { stroke: url(#grad); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
  .ring .time {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .ring .time small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .timer-presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .timer-presets .btn.active { background: var(--accent); border-color: transparent; }
  .timer-ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .timer-custom { display: flex; gap: 8px; align-items: center; }
  .timer-custom input { width: 68px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 8px 10px; border-radius: 9px; font-size: 14px; font-family: inherit; }
  .timer-status { font-size: 13px; color: var(--muted); }
  .today-focus { text-align: center; margin-top: 6px; font-size: 13px; }
  .today-focus b { color: var(--accent-2); font-size: 18px; }
  .modal-mask {
    position: fixed; inset: 0; z-index: 50; background: rgba(8,12,24,.66);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 24px; width: 100%; max-width: 380px;
  }
  .modal-box h3 { font-size: 17px; margin-bottom: 6px; }
  .modal-box p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .modal-box select {
    width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-size: 14px; font-family: inherit; margin-bottom: 16px;
  }
  .task-pick-list { max-height: 220px; overflow-y: auto; margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .task-pick-row { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
  .task-pick-row.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .task-pick-row .pick-name { flex: 1; word-break: break-all; }
  .pick-del { border: none; background: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 0 6px; border-radius: 6px; line-height: 1.4; }
  .pick-del:hover { background: rgba(248,113,113,.15); }
  .modal-box input[type=text], .modal-box input[type=number], .modal-box input[type=date] {
    width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-size: 14px; font-family: inherit;
  }
  .modal-box input + input { margin-top: 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .task-group { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .task-group-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; }
  .task-group-head .tg-name { font-weight: 700; }
  .task-group-head .tg-count { color: var(--muted); font-size: 12px; }
  .tg-bar { height: 6px; margin-bottom: 8px; }
  .stage select.task-stage-pick {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 5px 6px; border-radius: 8px; font-family: inherit; font-size: 12px; max-width: 112px;
  }
  .stage-add select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 10px; border-radius: 9px; font-family: inherit; font-size: 13px;
  }
  .auto-arch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 10px; cursor: pointer; }
  .auto-arch input { accent-color: var(--accent); width: 14px; height: 14px; }
  .archive-toggle {
    margin-top: 4px; cursor: pointer; color: var(--muted); font-size: 12px;
    background: none; border: none; font-family: inherit; padding: 4px 0;
  }
  .archive-toggle:hover { color: var(--text); }
  .archived-list { margin-top: 6px; }
  .archived-list .stage { opacity: .72; }
  .archived-list .stage .stage-title { color: var(--muted); }
  .tree-block { margin-top: 6px; }
  .stage-root { background: rgba(255,255,255,.055); border: 1px solid var(--line); border-radius: 11px; }
  .node-row { background: transparent; border: none; }
  .tgl { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 2px 4px; width: 20px; flex: none; }
  .tgl:hover { color: var(--text); }
  .focus-edit { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .focus-edit:hover { color: var(--accent-2); background: rgba(255,255,255,.07); }
  .tree-children { padding-left: 2px; }
  .legend { display: flex; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 2px; vertical-align: -1px; }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat-card { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat-card span { font-size: 12px; color: var(--muted); }
  .stat-card b { display: block; font-size: 21px; margin-top: 4px; color: var(--accent-2); }
  .mark { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; flex: none; }
  .mark.green { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .mark.orange { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .mark.red { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .date-green { color: var(--good); }
  .date-orange { color: var(--warn); }
  .date-red { color: var(--danger); }
  .tl-rows { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .tl-row { padding: 10px 14px; }
  .tl-row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .tl-row-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .timeline { position: relative; padding-top: 22px; display: flex; align-items: stretch; overflow-x: auto; }
  .timeline::before { content: ""; position: absolute; top: 11px; left: 14px; right: 14px; height: 2px; background: var(--line); border-radius: 2px; }
  .tl-node { position: relative; flex: 1 0 72px; min-width: 72px; text-align: center; padding: 0 6px 4px; }
  .tl-node::before {
    content: ""; position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 11px; height: 11px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.22);
  }
  .tl-node.done::before { background: var(--good); box-shadow: 0 0 0 3px rgba(52,211,153,.22); }
  .tl-node.overdue::before { background: var(--danger); box-shadow: 0 0 0 3px rgba(248,113,113,.22); }
  .tl-node.today::before { background: var(--warn); box-shadow: 0 0 0 3px rgba(251,191,36,.22); }
  .tl-node .tl-title { font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.3; }
  .tl-node .tl-date { font-size: 10.5px; color: var(--muted); margin-top: 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tl-multi { min-width: 132px; flex-basis: auto; }
  .tl-branch { display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .tl-branch .tl-item { border-left: 1.5px dashed var(--line); padding-left: 8px; }
  .tl-branch .tl-item .tl-title { align-items: flex-start; }
  .tl-branch .tl-item .tl-date { align-items: flex-start; }

  /* 进度 */
  .progress-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .progress-row input[type=range] { flex: 1; accent-color: var(--accent); height: 6px; }
  .progress-row output { font-size: 22px; font-weight: 800; min-width: 58px; text-align: right; color: var(--accent-2); }
  textarea, input[type=text] {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: vertical;
  }
  input[type=text] { margin-top: 8px; }
  textarea { min-height: 72px; }
  .saved-hint { font-size: 12px; color: var(--good); opacity: 0; transition: .3s; }
  .saved-hint.show { opacity: 1; }

  /* 阶段目标 */
  .stage { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; background: rgba(255,255,255,.04); margin-bottom: 8px; border: 1px solid transparent; }
  .stage:hover { border-color: var(--line); }
  .stage.done .stage-title { text-decoration: line-through; color: var(--muted); }
  .stage input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--good); cursor: pointer; flex: none; }
  .stage .stage-title { flex: 1; font-size: 14px; }
  .stage .stage-date { font-size: 12px; color: var(--muted); }
  .stage .del { color: var(--muted); cursor: pointer; font-size: 15px; border: none; background: none; padding: 2px 6px; border-radius: 6px; }
  .stage .del:hover { color: var(--danger); background: rgba(248,113,113,.12); }
  .stage-add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .stage-add input { flex: 1; min-width: 120px; margin-top: 0; }
  .stage-add input[type=date] { width: auto; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 9px 12px; border-radius: 9px; font-family: inherit; font-size: 13px; }
  .empty-tip { color: var(--muted); font-size: 13px; padding: 10px 0; }

  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }
  footer .actions { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 11px 20px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: .25s; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
  .hide { display: none !important; }
</style>
</head>
<body>
<video class="bg-video" src="assets/background.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<div class="bg-overlay"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">🚀</div>
      <div>
        <h1>考研统筹舱</h1>
        <p>未来的我实现梦想了吗？</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn ghost small" onclick="location.hash='#/stats'">📊 学习痕迹</button>
      <button class="btn ghost small" onclick="openSyncModal()">☁️ 同步</button>
      <button class="btn ghost small" onclick="exportData()">导出数据</button>
      <button class="btn ghost small" onclick="document.getElementById('importFile').click()">导入数据</button>
      <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(event)">
    </div>
  </header>

  <main id="view"></main>

  <footer>
    <div class="actions">
      <button class="btn ghost small" onclick="goHome()">⌂ 回到首页</button>
      <button class="btn ghost small" onclick="undo()">↩ 撤销</button>
      <button class="btn ghost small danger" onclick="if(confirm('确定清空所有记录数据吗？可用「撤销」恢复。')) resetAll()">重置全部数据</button>
    </div>
    数据保存在浏览器本地 · 可撤销最近 20 步操作(Ctrl/⌘ + Z)
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="taskModal">
  <div class="modal-box">
    <h3>🎉 专注完成!</h3>
    <p id="taskModalText">这次专注要记录到哪个任务?</p>
    <div class="task-pick-list" id="taskPickList"></div>
    <div class="modal-actions">
      <button class="btn ghost small" onclick="taskModalCancel()">不记录</button>
      <button class="btn primary small" onclick="taskModalConfirm()">记录</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="editModal">
  <div class="modal-box">
    <h3 id="editModalTitle">编辑</h3>
    <input type="text" id="editName" placeholder="名称">
    <input type="date" id="editDate" style="display:none">
    <input type="number" id="editMin" min="0" placeholder="计划分钟" style="display:none">
    <input type="number" id="editFocus" min="0" placeholder="已专注分钟" style="display:none">
    <div class="modal-actions" style="margin-top:18px">
      <button class="btn ghost small" onclick="editCancel()">取消</button>
      <button class="btn primary small" onclick="editSave()">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="taskAddModal">
  <div class="modal-box">
    <h3>添加任务</h3>
    <input type="text" id="taName" placeholder="任务名称,如:极限计算练习">

function dailyQuote() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const doy = Math.floor((now - start) / 86400000);
  return QUOTES[doy % QUOTES.length];
}

let data = load();
let lastSaved = null;
let undoStack = [];
const UNDO_MAX = 20;
lastSaved = JSON.stringify(data);

/* ---------- 数据 ---------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtDate(d) {
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function today() { return fmtDate(new Date()); }
function defaultStages() {
  return [
    { id: uid(), title: "基础阶段", targetDate: "", done: false, tree: [] },
    { id: uid(), title: "强化阶段", targetDate: "", done: false, tree: [] },
    { id: uid(), title: "冲刺阶段", targetDate: "", done: false, tree: [] }
  ];
}
function defaultData() {
  return {
    examDate: EXAM_DEFAULT,
    subjects: {},
    focusLogs: []
  };
}
function freshData() {
  const d = defaultData();
  for (const k of Object.keys(SUBJECTS)) {
    d.subjects[k] = { progress: 0, note: "", updated: "", stages: defaultStages(), tasks: [], autoArchive: true, milestones: [] };
  }
  return d;
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return freshData();
    const d = JSON.parse(raw);
    const merged = freshData();
    for (const k of Object.keys(SUBJECTS)) {
      if (d.subjects && d.subjects[k]) {
        merged.subjects[k] = Object.assign(merged.subjects[k], d.subjects[k]);
        if (!Array.isArray(merged.subjects[k].stages)) merged.subjects[k].stages = defaultStages();
        merged.subjects[k].stages.forEach(s => { if (!Array.isArray(s.tree)) s.tree = []; });
        if (!Array.isArray(merged.subjects[k].tasks)) merged.subjects[k].tasks = [];
        if (!Array.isArray(merged.subjects[k].milestones)) merged.subjects[k].milestones = [];
        if (typeof merged.subjects[k].autoArchive !== "boolean") merged.subjects[k].autoArchive = true;
      }
    }
    if (d.examDate) merged.examDate = d.examDate;
    if (Array.isArray(d.focusLogs)) merged.focusLogs = d.focusLogs;
    return merged;
  } catch (e) {
    return freshData();
  }
}
function save() {
  const next = JSON.stringify(data);
  if (lastSaved !== null && lastSaved !== next) {
    undoStack.push(lastSaved);
    if (undoStack.length > UNDO_MAX) undoStack.shift();
  }
  lastSaved = next;
  localStorage.setItem(LS_KEY, next);
}
function undo() {
  if (!undoStack.length) { toast("没有可撤销的操作"); return; }
  const prev = undoStack.pop();
  try {
    data = JSON.parse(prev);
  } catch (e) {
    toast("撤销失败");
    return;
  }
  lastSaved = prev;
  localStorage.setItem(LS_KEY, prev);
  render();
  toast("已撤销上一步");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}
function resetAll() {
  data = freshData();
  save();
  render();
  toast("已重置全部数据");
}
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "考研统筹数据-" + today() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出数据文件");
}
function importData(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d.subjects) throw new Error("bad");
      const merged = freshData();
      for (const k of Object.keys(SUBJECTS)) {
        if (d.subjects[k]) merged.subjects[k] = Object.assign(merged.subjects[k], d.subjects[k]);
      }
      if (d.examDate) merged.examDate = d.examDate;
      if (Array.isArray(d.focusLogs)) merged.focusLogs = d.focusLogs;
      data = merged;
      save();
      render();
      toast("导入成功");
    } catch (e) {
      toast("文件格式不正确，导入失败");
    }
  };
  reader.readAsText(f);
  ev.target.value = "";
}

/* ---------- GitHub 云端同步 ---------- */
const SYNC_PATH = "data/kaoyan-plan.json";
const SYNC_API = "https://api.github.com/repos/baishenwukong1/future/contents/" + SYNC_PATH;
const SYNC_RAW = "https://raw.githubusercontent.com/baishenwukong1/future/main/" + SYNC_PATH;
function syncToken() { return localStorage.getItem("ky_sync_token") || ""; }
function b64u8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function openSyncModal() {
  document.getElementById("syncToken").value = syncToken();
  document.getElementById("syncStatus").textContent = "";
  document.getElementById("syncModal").classList.add("show");
}
function closeSyncModal() {
  document.getElementById("syncModal").classList.remove("show");
}
function saveSyncToken() {
  const tk = document.getElementById("syncToken").value.trim();
  if (!tk) { toast("请输入令牌"); return; }
  localStorage.setItem("ky_sync_token", tk);
  document.getElementById("syncStatus").textContent = "✅ 令牌已保存到本机";
  toast("令牌已保存");
}
function syncPush() {
  const tk = syncToken();
  const status = document.getElementById("syncStatus");
  if (!tk) { status.textContent = "请先粘贴并保存 GitHub 令牌"; return; }
  status.textContent = "正在推送…";
  fetch(SYNC_API, { headers: { Authorization: "Bearer " + tk, Accept: "application/vnd.github+json" } })
    .then(r => r.ok ? r.json() : (r.status === 404 ? null : Promise.reject(r.status)))
    .then(existing => {
      const body = {
        message: "统筹舱进度同步 " + new Date().toISOString(),
        content: b64u8(JSON.stringify(data, null, 1))
      };
      if (existing && existing.sha) body.sha = existing.sha;
      return fetch(SYNC_API, {
        method: "PUT",
        headers: { Authorization: "Bearer " + tk, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
    })
    .then(r => { if (!r.ok) throw r.status; return r.json(); })
    .then(() => {
      status.textContent = "✅ 已推送到云端(" + new Date().toLocaleString() + ")";
      toast("已推送到云端");
    })
    .catch(e => { status.textContent = "推送失败(错误 " + e + "),请检查令牌与仓库权限"; });
}
function syncPull() {
  const status = document.getElementById("syncStatus");
  status.textContent = "正在拉取…";
  fetch(SYNC_RAW)
    .then(r => { if (!r.ok) throw r.status; return r.json(); })
    .then(d => {
      if (!d || !d.subjects) throw "format";
      if (!confirm("将从云端覆盖本地数据,确定吗?")) { status.textContent = "已取消"; return; }
      const merged = freshData();
      for (const k of Object.keys(SUBJECTS)) {
        if (d.subjects[k]) merged.subjects[k] = Object.assign(merged.subjects[k], d.subjects[k]);
      }
      if (d.examDate) merged.examDate = d.examDate;
      if (Array.isArray(d.focusLogs)) merged.focusLogs = d.focusLogs;
      data = merged;
      save();
      render();
      status.textContent = "✅ 已从云端恢复";
      toast("已从云端恢复");
    })
    .catch(e => { status.textContent = "拉取失败(错误 " + e + "),云端可能还没有数据"; });
}

/* ---------- 倒计时 ---------- */
function countdownHTML() {
  const target = new Date(data.examDate + "T00:00:00");
  const now = new Date();
  let diff = Math.floor((target - now) / 1000);
  if (diff < 0) diff = 0;
  const days = Math.floor(diff / 86400);
  const hours = Math.floor((diff % 86400) / 3600);
  const mins = Math.floor((diff % 3600) / 60);
  const secs = diff % 60;
  const pad = n => String(n).padStart(2, "0");
  return `
    <div class="card countdown">
      <div class="label">距 2027 考研还有</div>
      <div class="big">${days}<small> 天</small></div>
      <div class="detail">${pad(hours)} : ${pad(mins)} : ${pad(secs)}</div>
      <div class="quote">💪 ${esc(dailyQuote())}</div>
      <div class="date-edit">
        <input type="date" value="${data.examDate}" onchange="setExamDate(this.value)">
        <button class="btn small" onclick="alert('默认考试日期为 2026-12-19(2027 考研初试预计时间),可在日期框里修改。')">考试日期</button>
      </div>
    </div>`;
}

}

function cardHTML(k) {

}
function dashboardHTML() {
  return `
    ${countdownHTML()}
    <div class="tl-rows">
      ${Object.keys(SUBJECTS).map(timelineRowHTML).join("")}
    </div>
    <div class="subject-strip">
      ${Object.keys(SUBJECTS).map(cardHTML).join("")}
    </div>`;
}
function timelineRowHTML(k) {
  const s = SUBJECTS[k];
  return `
    <div class="card tl-row">
      <div class="tl-row-head">
        <span class="tl-row-name">${s.icon} ${s.name}</span>
        <button class="btn small" onclick="openMilestoneAdd('${k}')">＋ 添加</button>
      </div>
      ${timelineHTML(k)}
    </div>`;
}
function timelineHTML(k) {
  const sub = data.subjects[k];
  const nodes = [];
  sub.stages.forEach(s => { if (s.targetDate) nodes.push({ id: s.id, name: s.title, date: s.targetDate, done: !!s.done, kind: "stage" }); });
  sub.milestones.forEach(m => nodes.push({ id: m.id, name: m.name, date: m.date, done: false, kind: "ms" }));
  nodes.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const groups = [];
  const byDate = {};
  nodes.forEach(n => {
    if (!byDate[n.date]) { byDate[n.date] = { date: n.date, items: [] }; groups.push(byDate[n.date]); }
    byDate[n.date].items.push(n);
  });
  return `
    <div class="timeline">
      ${groups.length === 0 ? `<div class="empty-tip">暂无时间点,添加一个吧</div>` : groups.map(g => tlGroupHTML(k, g)).join("")}
    </div>`;
}
function tlGroupHTML(k, g) {
  const st = tlGroupState(g.items);
  const multi = g.items.length > 1;
  return `
    <div class="tl-node ${st.cls} ${multi ? "tl-multi" : ""}">
      ${multi
        ? `<div class="tl-branch">${g.items.map(n => tlItemHTML(k, n, g.date)).join("")}</div>`
        : tlItemHTML(k, g.items[0], g.date)}
    </div>`;
}
function tlItemHTML(k, n, date) {
  const st = tlState(n);
  return `
    <div class="tl-item">
      <div class="tl-title">${n.kind === "stage" ? "📁" : "📌"} ${esc(n.name)} ${n.done ? `<span class="date-green">✓ 已完成</span>` : ""}</div>
      <div class="tl-date">
        <span>${date} · ${st.text}</span>
        ${n.kind === "ms" ? `
          <button class="del" style="color:var(--accent-2)" onclick="openMilestoneEdit('${k}','${n.id}')" title="编辑">✏️</button>
          <button class="del" onclick="deleteMilestone('${k}','${n.id}')" title="删除">✕</button>` : ""}
      </div>
    </div>`;
}
function tlGroupState(items) {
  if (items.every(n => n.done)) return { cls: "done" };
  if (items.some(n => !n.done && n.date < today())) return { cls: "overdue" };
  if (items.some(n => n.date === today())) return { cls: "today" };
  return { cls: "" };
}
function tlState(n) {
  if (n.done) return { cls: "done", text: "已完成" };
  const t = today();
  if (n.date === t) return { cls: "today", text: "就是今天" };
  if (n.date < t) {
    const days = Math.round((new Date(t) - new Date(n.date)) / 86400000);
    return { cls: "overdue", text: "已逾期 " + days + " 天" };
  }
  const days = Math.round((new Date(n.date) - new Date(t)) / 86400000);
  return { cls: "", text: "还有 " + days + " 天" };
}
function deleteMilestone(k, id) {
  data.subjects[k].milestones = data.subjects[k].milestones.filter(m => m.id !== id);
  save();

function openMilestoneEdit(k, id) {

  if (t) {
    const parts = val.split("|");
    t.stageId = parts[0] || null;
    t.nodeId = parts[1] || null;
    save();
    render();
  }
}

/* ---------- 专注记录到任务 ---------- */
let taskModalSubject = null;
let taskModalMin = 0;
let taskModalSelected = null;
function openTaskModal(k, minutes) {
  const list = data.subjects[k].tasks;
  if (!list.length) return false;
  taskModalSubject = k;
  taskModalMin = minutes;
  taskModalSelected = list[0].id;
  document.getElementById("taskModalText").textContent = "这次专注 " + minutes + " 分钟,要记录到哪个任务?";
  renderTaskPickList();
  document.getElementById("taskModal").classList.add("show");
  return true;
}
function renderTaskPickList() {
  const list = data.subjects[taskModalSubject].tasks;
  const el = document.getElementById("taskPickList");
  if (!list.length) {
    el.innerHTML = '<div class="empty-tip">这个科目已经没有任务了,可只记录专注时长</div>';
    taskModalSelected = null;
    return;
  }
  if (!list.some(t => t.id === taskModalSelected)) taskModalSelected = list[0].id;
  el.innerHTML = list.map(t => `
    <div class="task-pick-row ${t.id === taskModalSelected ? "sel" : ""}" onclick="pickTask('${t.id}')">
      <span class="pick-name">${esc(t.name)}${t.done ? " ✓" : ""}</span>
      <button class="pick-del" onclick="event.stopPropagation();deleteTaskFromModal('${taskModalSubject}','${t.id}')" title="删除此任务">−</button>
    </div>`).join("");
}
function pickTask(id) {
  taskModalSelected = id;
  renderTaskPickList();
}
function deleteTaskFromModal(k, id) {
  data.subjects[k].tasks = data.subjects[k].tasks.filter(x => x.id !== id);
  save();
  renderTaskPickList();
  toast("已删除任务");
}
function taskModalClose() {
  document.getElementById("taskModal").classList.remove("show");
  taskModalSubject = null;
  taskModalSelected = null;
}
function taskModalCancel() { taskModalClose(); }
function taskModalConfirm() {
  if (!taskModalSelected) { toast("请先选择一个任务"); return; }
  const t = data.subjects[taskModalSubject].tasks.find(x => x.id === taskModalSelected);
  if (t) {
    t.focusMin = (t.focusMin || 0) + taskModalMin;
    save();
  }
  taskModalClose();
  render();
  toast("已记录到任务");
}

/* ---------- 编辑阶段目标 / 任务 ---------- */
let editSubject = null;
let editType = null;
let editId = null;
let editStageId = null;
let editParentNodeId = null;
function openStageEdit(k, id) {
  const s = data.subjects[k].stages.find(x => x.id === id);
  if (!s) return;
  editSubject = k; editType = "stage"; editId = id;
  document.getElementById("editModalTitle").textContent = "编辑阶段目标";
  document.getElementById("editName").value = s.title;
  document.getElementById("editDate").value = s.targetDate || "";
  document.getElementById("editDate").style.display = "";
  document.getElementById("editMin").style.display = "none";
  document.getElementById("editFocus").style.display = "none";
  document.getElementById("editModal").classList.add("show");
}
function openTaskEdit(k, id) {
  const t = data.subjects[k].tasks.find(x => x.id === id);
  if (!t) return;
  editSubject = k; editType = "task"; editId = id;
  document.getElementById("editModalTitle").textContent = "编辑任务";
  document.getElementById("editName").value = t.name;
  document.getElementById("editMin").value = t.plannedMin || "";
  document.getElementById("editFocus").value = t.focusMin || 0;
  document.getElementById("editDate").style.display = "none";
  document.getElementById("editMin").style.display = "";
  document.getElementById("editFocus").style.display = "";
  document.getElementById("editModal").classList.add("show");
}
function openNodeEdit(k, stageId, nodeId) {
  const s = data.subjects[k].stages.find(x => x.id === stageId);
  const n = s && findNode(s, nodeId);
  if (!n) return;
  editSubject = k; editType = "node"; editStageId = stageId; editId = nodeId;
  document.getElementById("editModalTitle").textContent = "编辑内容";
  document.getElementById("editName").value = n.title;
  document.getElementById("editDate").style.display = "none";
  document.getElementById("editMin").style.display = "none";
  document.getElementById("editFocus").style.display = "none";
  document.getElementById("editModal").classList.add("show");
}
function openNodeAdd(k, stageId, parentNodeId) {
  editSubject = k; editType = "node-new"; editStageId = stageId; editParentNodeId = parentNodeId || null; editId = null;
  document.getElementById("editModalTitle").textContent = "添加内容";
  document.getElementById("editName").value = "";
  document.getElementById("editDate").style.display = "none";
  document.getElementById("editMin").style.display = "none";
  document.getElementById("editFocus").style.display = "none";
  document.getElementById("editModal").classList.add("show");
}
function openTaskAdd(k, stageId, nodeId) {
  taSubject = k;
  taPresetStage = stageId || null;
  taPresetNode = nodeId || null;
  document.getElementById("taName").value = "";
  document.getElementById("taMin").value = "";
  fillTaStage();
  document.getElementById("taskAddModal").classList.add("show");
}
let taSubject = null;
let taPresetStage = null;
let taPresetNode = null;
function fillTaStage() {
  const stages = data.subjects[taSubject].stages;
  document.getElementById("taStage").innerHTML =
    '<option value="">选择阶段目标…</option>' +
    stages.map(s => `<option value="${s.id}" ${taPresetStage === s.id ? "selected" : ""}>${esc(s.title)}</option>`).join("");
  taStageChanged();
}
function taStageChanged() {
  const stageId = document.getElementById("taStage").value;
  const stage = data.subjects[taSubject].stages.find(s => s.id === stageId);
  const bigSel = document.getElementById("taBig");
  if (!stage) {
    bigSel.innerHTML = '<option value="">请先选择阶段</option>';
    document.getElementById("taSmall").innerHTML = "";
    return;
  }
  bigSel.innerHTML = '<option value="">直接挂在阶段下</option>' +
    stage.tree.map(n => `<option value="${n.id}">${esc(n.title)}</option>`).join("");
  if (taPresetNode) {
    const topNode = stage.tree.find(n => {
      let found = false;
      const scan = node => {
        if (node.id === taPresetNode) { found = true; return; }
        (node.children || []).forEach(scan);
      };
      scan(n);
      return found;
    });
    if (topNode) {
      bigSel.value = topNode.id;
    }
  }
  taBigChanged();
}
function taBigChanged() {
  const stageId = document.getElementById("taStage").value;
  const bigId = document.getElementById("taBig").value;
  const stage = data.subjects[taSubject].stages.find(s => s.id === stageId);
  const sel = document.getElementById("taSmall");
  if (!stage || !bigId) {
    sel.innerHTML = '<option value="">无(直接挂在阶段下)</option>';
    return;
  }
  const big = findNode(stage, bigId);
  if (!big) { sel.innerHTML = '<option value="">无</option>'; return; }
  let opts = '<option value="">直接挂在大类下</option>';
  const walk = (node, depth) => {
    node.children.forEach(c => opts += `<option value="${c.id}">${"　".repeat(depth)}${esc(c.title)}</option>`);
    node.children.forEach(c => walk(c, depth + 1));
  };
  walk(big, 1);
  sel.innerHTML = opts;
  if (taPresetNode && taPresetNode !== bigId) {
    sel.value = taPresetNode;
  }
}
function saveTaskAdd() {
  const name = document.getElementById("taName").value.trim();
  const min = parseInt(document.getElementById("taMin").value || "0", 10);
  const stageId = document.getElementById("taStage").value;
  if (!name) { toast("请输入任务名称"); return; }
  if (!stageId) { toast("请选择所属阶段"); return; }
  const bigId = document.getElementById("taBig").value;
  const smallId = document.getElementById("taSmall").value;
  const nodeId = smallId || bigId || null;
  data.subjects[taSubject].tasks.push({ id: uid(), name, plannedMin: Math.max(0, min), done: false, focusMin: 0, stageId, nodeId });
  if (nodeId) expandedNodes.add(nodeId);
  else expandedStages.add(stageId);
  save();
  render();
  closeTaskAdd();
  toast("已添加任务");
}
function closeTaskAdd() {
  document.getElementById("taskAddModal").classList.remove("show");
  taSubject = null;
  taPresetStage = null;
  taPresetNode = null;
}
function editCancel() {
  document.getElementById("editModal").classList.remove("show");
  editSubject = editType = editId = editStageId = editParentNodeId = null;
}
function editSave() {
  const name = document.getElementById("editName").value.trim();
  if (!name) { toast("名称不能为空"); return; }
  if (editType === "stage") {
    const s = data.subjects[editSubject].stages.find(x => x.id === editId);
    if (s) {
      s.title = name;
      s.targetDate = document.getElementById("editDate").value;
    }
  } else if (editType === "task") {
    const t = data.subjects[editSubject].tasks.find(x => x.id === editId);
    if (t) {
      const oldFocus = t.focusMin || 0;
      t.name = name;
      t.plannedMin = Math.max(0, parseInt(document.getElementById("editMin").value || "0", 10));
      t.focusMin = Math.max(0, parseInt(document.getElementById("editFocus").value || "0", 10));
      const delta = t.focusMin - oldFocus;
      if (delta !== 0) {
        data.focusLogs.push({ date: today(), subject: editSubject, minutes: delta, ts: Date.now() });
      }
    }
  } else if (editType === "milestone") {
    const m = data.subjects[editSubject].milestones.find(x => x.id === editId);
    if (m) {
      m.name = name;
      m.date = document.getElementById("editDate").value;
    }
  } else if (editType === "milestone-new") {
    const date = document.getElementById("editDate").value;
    if (!date) { toast("请选择日期"); return; }
    data.subjects[editSubject].milestones.push({ id: uid(), name, date });
  } else if (editType === "node") {
    const s = data.subjects[editSubject].stages.find(x => x.id === editStageId);
    const n = s && findNode(s, editId);
    if (n) n.title = name;
  } else if (editType === "node-new") {
    const s = data.subjects[editSubject].stages.find(x => x.id === editStageId);
    if (s) {
      const node = { id: uid(), title: name, done: false, children: [] };
      if (editParentNodeId) {
        const p = findNode(s, editParentNodeId);
        if (p) {
          p.children.push(node);
          expandedNodes.add(editParentNodeId);
        }
      } else {
        s.tree.push(node);
        expandedStages.add(editStageId);
      }
    }
  }
  editCancel();
  save();
  render();
  toast("已保存修改");
}

/* ---------- 阶段目标 ---------- */
function addStage(k) {
  const title = document.getElementById("stageTitle").value.trim();
  if (!title) { toast("请输入目标名称"); return; }
  const targetDate = document.getElementById("stageDate").value;
  data.subjects[k].stages.push({ id: uid(), title, targetDate, done: false, tree: [] });
  save();
  render();
  toast("已添加阶段目标");
}
function toggleStage(k, id) {
  const s = data.subjects[k].stages.find(x => x.id === id);
  if (s) {
    s.done = !s.done;
    s.doneAt = s.done ? today() : null;
    save();
    render();
  }
}
function deleteStage(k, id) {
  data.subjects[k].tasks.forEach(t => { if (t.stageId === id) { t.stageId = null; t.nodeId = null; } });
  expandedStages.delete(id);
  data.subjects[k].stages = data.subjects[k].stages.filter(x => x.id !== id);
  save();
  render();
  toast("已删除阶段,其任务已移至未分组");
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

/* ---------- 学习痕迹图表 ---------- */
function dayLevel(min) {
  if (!min) return 0;
  if (min < 30) return 1;
  if (min < 60) return 2;
  if (min < 90) return 3;
  return 4;
}
function focusByDate(subject) {
  const map = {};
  data.focusLogs.forEach(l => { if (!subject || l.subject === subject) map[l.date] = (map[l.date] || 0) + l.minutes; });
  for (const k in map) { if (map[k] < 0) map[k] = 0; }
  return map;
}
function fmtD(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function heatmapSVG(subject, weeks) {
  const map = focusByDate(subject);
  const colors = ["rgba(255,255,255,.07)", "rgba(52,211,153,.30)", "rgba(52,211,153,.55)", "rgba(52,211,153,.80)", "#34d399"];
  const cell = 11, gap = 3;
  const end = new Date();
  const start = new Date(end);
  start.setDate(start.getDate() - (weeks * 7 - 1));
  start.setDate(start.getDate() - start.getDay());
  const cols = Math.ceil((end - start) / (7 * 86400000));
  const todayStr = fmtD(new Date());
  let h = '<div style="overflow-x:auto"><svg width="' + (cols * (cell + gap) + 4) + '" height="' + (7 * (cell + gap) + 26) + '" role="img" aria-label="学习热力图">';
  for (let c = 0; c < cols; c++) {
    const d = new Date(start);
    d.setDate(start.getDate() + c * 7);
    if (d.getDate() <= 7) h += '<text x="' + (c * (cell + gap)) + '" y="10" font-size="9" fill="#8ea3bf">' + (d.getMonth() + 1) + '月</text>';
  }
  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < 7; r++) {
      const d = new Date(start);
      d.setDate(start.getDate() + c * 7 + r);
      if (d > end) continue;
      const key = fmtD(d);
      const mins = map[key] || 0;
      const x = c * (cell + gap), y = 26 + r * (cell + gap);
      h += '<rect x="' + x + '" y="' + y + '" width="' + cell + '" height="' + cell + '" rx="2.5" fill="' + colors[dayLevel(mins)] + '">' +
        '<title>' + key + (key === todayStr ? "(今天)" : "") + ' 专注 ' + mins + ' 分钟</title></rect>';
    }
  }
  h += '</svg></div>';
  return h;
}
function heatmapLegend() {
  const colors = ["rgba(255,255,255,.07)", "rgba(52,211,153,.30)", "rgba(52,211,153,.55)", "rgba(52,211,153,.80)", "#34d399"];
  return '<div class="legend"><span>少</span>' + colors.map(c => '<span class="sw" style="background:' + c + '"></span>').join("") + '<span>多</span><span>· 颜色越深,当天专注越久</span></div>';
}
function doneByDate() {
  const map = {};
  for (const k in SUBJECTS) {
    data.subjects[k].tasks.forEach(t => { if (t.done && t.doneAt) map[t.doneAt] = (map[t.doneAt] || 0) + 1; });
  }
  return map;
}
function dailyChartSVG() {
  const days = 30;
  const focus = focusByDate(null);
  const doneMap = doneByDate();
  const arr = [];
  const now = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(now.getDate() - i);
    const key = fmtD(d);
    arr.push({ key, min: focus[key] || 0, done: doneMap[key] || 0 });
  }
  const maxMin = Math.max(1, ...arr.map(x => x.min));
  const maxDone = Math.max(1, ...arr.map(x => x.done));
  const W = 680, H = 190, top = 14, base = 150;
  const slot = W / days;
  let h = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="近30天趋势">';
  h += '<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '" stroke="#263449" stroke-width="1"/>';
  arr.forEach((x, i) => {
    const bw = Math.max(2, slot * 0.6);
    const bh = x.min / maxMin * (base - top);
    h += '<rect x="' + (i * slot + (slot - bw) / 2).toFixed(1) + '" y="' + (base - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="rgba(99,102,241,.75)" rx="2">' +
      '<title>' + x.key + ' 专注 ' + x.min + ' 分钟</title></rect>';
  });
  const pts = arr.map((x, i) => (i * slot + slot / 2).toFixed(1) + ',' + (base - x.done / maxDone * (base - top)).toFixed(1));
  h += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#34d399" stroke-width="2"/>';
  for (let i = 0; i < days; i += 5) {
    h += '<text x="' + (i * slot + slot / 2) + '" y="' + (base + 16) + '" font-size="9" text-anchor="middle" fill="#8ea3bf">' + arr[i].key.slice(5).replace("-", "/") + '</text>';
  }
  h += '</svg>';
  return h;
}
function streakDays() {
  const set = new Set(data.focusLogs.map(l => l.date));
  const d = new Date();
  if (!set.has(fmtD(d))) d.setDate(d.getDate() - 1);
  let s = 0;
  while (set.has(fmtD(d))) { s++; d.setDate(d.getDate() - 1); }
  return s;
}
function renderStatsPage() {
  const totalMin = Math.max(0, data.focusLogs.reduce((a, b) => a + b.minutes, 0));
  let doneTasks = 0;
  for (const k in SUBJECTS) doneTasks += data.subjects[k].tasks.filter(t => t.done).length;
  const focusDays = new Set(data.focusLogs.map(l => l.date)).size;
  const avg = focusDays ? Math.round(totalMin / focusDays) : 0;
  const cards = [
    ["累计专注", Math.round(totalMin / 60 * 10) / 10 + " 小时"],
    ["完成任务", doneTasks + " 个"],
    ["连续坚持", streakDays() + " 天"],
    ["活跃天数", focusDays + " 天"],
    ["日均专注", avg + " 分钟"]
  ];
  return `
    <div class="sub-header">
      <a class="back" href="#" onclick="event.preventDefault();goHome()">← 返回首页</a>
      <h2>📊 学习痕迹</h2>
    </div>
    <div class="stat-cards">${cards.map(c => `<div class="stat-card"><span>${c[0]}</span><b>${c[1]}</b></div>`).join("")}</div>
    <div class="card" style="margin-top:14px">
      <h2><span class="dot"></span>专注热力图 · 近 14 周</h2>
      ${heatmapSVG(null, 14)}
      ${heatmapLegend()}
    </div>
    <div class="card" style="margin-top:14px">
      <h2><span class="dot"></span>近 30 天 · 专注时长与完成任务</h2>
      ${dailyChartSVG()}
      <div class="legend"><span class="sw" style="background:rgba(99,102,241,.75)"></span>专注分钟<span class="sw" style="background:#34d399"></span>完成任务数</div>
    </div>`;
}

/* ---------- 渲染 ---------- */
function render() {
  const hash = location.hash.replace(/^#\//, "");
  const view = document.getElementById("view");
  if (SUBJECTS[hash]) {
    document.title = SUBJECTS[hash].name + " · 考研统筹舱";
    view.innerHTML = subjectHTML(hash);
  } else if (hash === "stats") {
    document.title = "学习痕迹 · 考研统筹舱";
    view.innerHTML = renderStatsPage();
  } else {
    document.title = "考研统筹舱 · 向未来出发";
    view.innerHTML = dashboardHTML();
  }
}
function goHome() { location.hash = ""; }
window.addEventListener("hashchange", render);
render();
setInterval(() => {
  if (!location.hash.replace(/^#\//, "")) {
    const c = document.querySelector(".countdown .big");
    const d = document.querySelector(".countdown .detail");
    if (c && d) {
      const target = new Date(data.examDate + "T00:00:00");
      let diff = Math.floor((target - new Date()) / 1000);
      if (diff < 0) diff = 0;
      c.innerHTML = Math.floor(diff / 86400) + "<small> 天</small>";
      const pad = n => String(n).padStart(2, "0");
      d.textContent = pad(Math.floor((diff % 86400) / 3600)) + " : " + pad(Math.floor((diff % 3600) / 60)) + " : " + pad(diff % 60);
    }
  }
}, 1000);
</script>
